<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracia Directa Chile</title>

    <!-- Tailwind CSS para el diseño visual profesional -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y Babel para que el navegador ejecute el código moderno directamente -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- SDK de Firebase para la base de datos en tiempo real -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f8fafc;
            margin: 0;
            color: #1e293b;
        }

        .gradient-text {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
        }

        .animate-fade-in {
            animation: fadeIn 0.5s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Estilo para los botones de votación */
        .vote-card:hover {
            transform: translateY(-4px);
            border-color: #6366f1;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // CONFIGURACIÓN DE TU PROYECTO FIREBASE
        const firebaseConfig = {
            apiKey: "AIzaSyBWxTfJGOFesMglypSc65qQEnFr5_dCXcU",
            authDomain: "democraciadirectacl-b75ad.firebaseapp.com",
            projectId: "democraciadirectacl-b75ad",
            storageBucket: "democraciadirectacl-b75ad.appspot.com",
            messagingSenderId: "837131448793",
            appId: "1:837131448793:web:2b5d2acf6e925bac8d29e8"
        };

        // Inicializar Firebase (Si no está inicializado)
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [view, setView] = useState('home');
            const [proposals, setProposals] = useState([]);
            const [currentPair, setCurrentPair] = useState([]);
            const [loading, setLoading] = useState(true);
            const [newIdea, setNewIdea] = useState("");
            const [isSubmitting, setIsSubmitting] = useState(false);

            useEffect(() => {
                // Autenticación anónima para permitir lectura/escritura segura
                auth.signInAnonymously().catch(err => console.error("Error Auth:", err));

                // Suscripción a la base de datos (Colección 'proposals')
                const unsubscribe = db.collection('proposals')
                    .onSnapshot((snapshot) => {
                        const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        setProposals(docs);
                        setLoading(false);
                    }, (error) => {
                        console.error("Error Firestore:", error);
                        setLoading(false);
                    });
                
                return () => unsubscribe();
            }, []);

            // Selector aleatorio para la votación
            useEffect(() => {
                if (view === 'vote' && currentPair.length === 0 && proposals.length >= 2) {
                    const shuffled = [...proposals].sort(() => 0.5 - Math.random());
                    setCurrentPair(shuffled.slice(0, 2));
                }
            }, [view, currentPair, proposals]);

            const handleVote = async (winnerId) => {
                const loserId = currentPair.find(p => p.id !== winnerId)?.id;
                const batch = db.batch();
                
                // Sumar voto al ganador y conteo de visualización a ambos
                batch.update(db.collection('proposals').doc(winnerId), {
                    votes: firebase.firestore.FieldValue.increment(1),
                    showCount: firebase.firestore.FieldValue.increment(1)
                });

                if (loserId) {
                    batch.update(db.collection('proposals').doc(loserId), {
                        showCount: firebase.firestore.FieldValue.increment(1)
                    });
                }
                
                try {
                    await batch.commit();
                    setCurrentPair([]); // Recargar nuevo par
                } catch (e) {
                    console.error("Error al votar:", e);
                }
            };

            const submitIdea = async () => {
                if (!newIdea.trim()) return;
                setIsSubmitting(true);
                try {
                    await db.collection('proposals').add({
                        title: "Propuesta Ciudadana",
                        desc: newIdea,
                        votes: 0,
                        showCount: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewIdea("");
                    setView('ranking');
                } catch (e) {
                    console.error("Error al publicar:", e);
                } finally {
                    setIsSubmitting(false);
                }
            };

            if (loading) {
                return (
                    <div className="flex h-screen items-center justify-center bg-white">
                        <div className="text-center">
                            <div className="w-12 h-12 border-4 border-indigo-600 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <p className="font-black text-slate-400 uppercase tracking-widest text-xs">Cargando Democracia...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen flex flex-col selection:bg-indigo-100">
                    {/* Header / Navegación */}
                    <nav className="fixed top-0 w-full z-50 bg-white/90 backdrop-blur-md border-b border-slate-200 px-6 py-4">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-indigo-600 text-white font-black px-2 py-1 rounded text-xs">CL</div>
                                <h1 className="font-black text-xl tracking-tighter uppercase text-slate-900">
                                    Chile<span className="text-indigo-600">Directo</span>
                                </h1>
                            </div>
                            <div className="flex gap-4 md:gap-8 items-center font-bold text-[10px] uppercase tracking-widest text-slate-500">
                                <button onClick={() => setView('vote')} className={`hover:text-indigo-600 transition-colors ${view === 'vote' ? 'text-indigo-600' : ''}`}>Votar</button>
                                <button onClick={() => setView('ranking')} className={`hover:text-indigo-600 transition-colors ${view === 'ranking' ? 'text-indigo-600' : ''}`}>Ranking</button>
                                <button onClick={() => setView('propose')} className="bg-indigo-600 text-white px-5 py-2.5 rounded-full shadow-lg shadow-indigo-200 hover:bg-indigo-700 transition-all active:scale-95">Proponer</button>
                            </div>
                        </div>
                    </nav>

                    {/* Main Content */}
                    <main className="flex-grow pt-32 pb-20 px-6 max-w-5xl mx-auto w-full animate-fade-in">
                        
                        {view === 'home' && (
                            <div className="text-center py-10 lg:py-20 space-y-12">
                                <h2 className="text-6xl md:text-8xl font-black tracking-tighter leading-[0.9] text-slate-900 uppercase">
                                    Las leyes, <br/><span className="gradient-text italic">decididas por ti.</span>
                                </h2>
                                <p className="text-lg md:text-xl text-slate-500 font-medium max-w-2xl mx-auto leading-relaxed">
                                    Participa en la priorización de propuestas legislativas. Vota de forma directa y transparente por el Chile que quieres construir.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 justify-center pt-6">
                                    <button onClick={() => setView('vote')} className="bg-slate-900 text-white px-10 py-5 rounded-2xl font-black text-lg shadow-xl hover:bg-slate-800 transition-all">
                                        COMENZAR A VOTAR
                                    </button>
                                    <button onClick={() => setView('propose')} className="bg-white text-slate-900 border-2 border-slate-200 px-10 py-5 rounded-2xl font-black text-lg hover:border-indigo-600 transition-all">
                                        SUBIR MI IDEA
                                    </button>
                                </div>
                            </div>
                        )}

                        {view === 'vote' && (
                            <div className="space-y-12">
                                <div className="text-center space-y-2">
                                    <h2 className="text-3xl font-black uppercase tracking-tighter text-slate-800 italic">Duelo de Prioridades</h2>
                                    <p className="text-slate-400 font-bold text-xs uppercase tracking-widest">Haz clic en la opción que consideres más urgente para el país</p>
                                </div>
                                <div className="grid md:grid-cols-2 gap-8">
                                    {currentPair.length > 0 ? currentPair.map(p => (
                                        <button 
                                            key={p.id} 
                                            onClick={() => handleVote(p.id)} 
                                            className="vote-card bg-white border-2 border-slate-100 p-10 rounded-[3rem] text-left transition-all card-shadow flex flex-col justify-between min-h-[320px] group"
                                        >
                                            <div>
                                                <div className="w-10 h-10 bg-slate-50 rounded-full flex items-center justify-center mb-6 group-hover:bg-indigo-50 transition-colors text-slate-400 group-hover:text-indigo-600 font-black">?</div>
                                                <h3 className="text-2xl font-black uppercase mb-4 leading-tight text-slate-800">{p.title}</h3>
                                                <p className="text-slate-500 font-medium text-base leading-relaxed">{p.desc}</p>
                                            </div>
                                            <div className="mt-8 text-[10px] font-black uppercase tracking-[0.2em] text-indigo-400 opacity-0 group-hover:opacity-100 transition-opacity">Votar por esta propuesta</div>
                                        </button>
                                    )) : (
                                        <div className="col-span-2 py-20 text-center text-slate-400 font-bold uppercase tracking-widest italic text-sm">
                                            Buscando propuestas activas...
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'ranking' && (
                            <div className="max-w-3xl mx-auto space-y-8">
                                <div className="flex justify-between items-end mb-10">
                                    <h2 className="text-4xl font-black tracking-tighter italic uppercase text-slate-900">Ranking <span className="text-indigo-600">País</span></h2>
                                    <p className="text-[10px] text-slate-400 font-black uppercase tracking-widest mb-1">Basado en preferencias ciudadanas</p>
                                </div>
                                
                                {proposals.length > 0 ? [...proposals].sort((a,b) => (b.votes/(b.showCount||1)) - (a.votes/(a.showCount||1))).map((p, i) => (
                                    <div key={p.id} className="bg-white p-8 rounded-[2.5rem] border border-slate-100 flex items-center justify-between shadow-sm hover:shadow-md transition-shadow">
                                        <div className="flex items-center gap-8">
                                            <span className="text-4xl font-black text-slate-100 italic w-12 text-center">#{i+1}</span>
                                            <div>
                                                <h3 className="font-black uppercase tracking-tight text-slate-800 text-base">{p.title}</h3>
                                                <div className="flex gap-4 mt-2">
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">{p.votes} Votos</p>
                                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">{p.showCount} Apariciones</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="flex flex-col items-end">
                                            <div className="text-indigo-600 font-black text-3xl italic">
                                                {p.showCount > 0 ? Math.round((p.votes / p.showCount) * 100) : 0}%
                                            </div>
                                            <div className="text-[8px] font-black text-slate-300 uppercase tracking-tighter">Aceptación</div>
                                        </div>
                                    </div>
                                )) : (
                                    <div className="text-center py-20 bg-white rounded-[3rem] border border-dashed border-slate-200">
                                        <p className="text-slate-400 font-bold uppercase tracking-widest text-xs italic">No hay datos suficientes para el ranking</p>
                                    </div>
                                )}
                            </div>
                        )}

                        {view === 'propose' && (
                            <div className="max-w-2xl mx-auto space-y-10">
                                <div className="text-center space-y-4">
                                    <h2 className="text-5xl font-black tracking-tighter italic uppercase text-slate-900">¿Qué mejorarías?</h2>
                                    <p className="text-slate-500 font-medium">Tu propuesta será sometida a votación contra otras ideas de ciudadanos.</p>
                                </div>
                                <div className="bg-white p-10 rounded-[3.5rem] shadow-2xl shadow-indigo-100/50 border border-slate-50">
                                    <textarea 
                                        className="w-full h-56 bg-slate-50 border-2 border-transparent rounded-[2.5rem] p-8 text-lg font-medium focus:border-indigo-600 focus:bg-white outline-none transition-all resize-none placeholder:text-slate-300"
                                        placeholder="Describe tu propuesta de ley o mejora para Chile de forma clara..."
                                        value={newIdea}
                                        onChange={(e) => setNewIdea(e.target.value)}
                                    />
                                    <button 
                                        onClick={submitIdea}
                                        disabled={isSubmitting || !newIdea.trim()}
                                        className="w-full mt-8 bg-indigo-600 text-white py-6 rounded-[2rem] font-black text-xl hover:bg-indigo-700 disabled:opacity-50 transition-all shadow-xl active:scale-[0.98]"
                                    >
                                        {isSubmitting ? 'PROCESANDO...' : 'PUBLICAR PROPUESTA'}
                                    </button>
                                </div>
                                <p className="text-center text-[10px] text-slate-400 font-bold uppercase tracking-widest px-10 leading-relaxed">
                                    Al publicar, aceptas que tu idea sea visible para todos los usuarios del sistema.
                                </p>
                            </div>
                        )}
                    </main>

                    {/* Footer */}
                    <footer className="py-16 text-center border-t border-slate-100 bg-white">
                        <div className="max-w-6xl mx-auto px-6 space-y-6">
                            <div className="font-black text-sm tracking-[0.5em] text-slate-300 uppercase">
                                Chile Directo 🇨 juice 2026
                            </div>
                            <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest max-w-sm mx-auto leading-relaxed">
                                Plataforma experimental de soberanía digital. <br/>Proyecto sin fines de lucro para el fortalecimiento democrático.
                            </p>
                        </div>
                    </footer>
                </div>
            );
        }

        // Renderizado Final
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

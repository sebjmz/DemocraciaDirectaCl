<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chile Directo | Soberanía Digital</title>

    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f1f5f9;
            margin: 0;
            overflow-x: hidden;
        }

        .gradient-bg {
            background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #020617 80%);
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-4px);
        }

        .accent-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vote-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .vote-card:active {
            transform: scale(0.95);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // CONFIGURACIÓN DE FIREBASE (Tus credenciales reales)
        const firebaseConfig = {
            apiKey: "AIzaSyBWxTfJGOFesMglypSc65qQEnFr5_dCXcU",
            authDomain: "democraciadirectacl-b75ad.firebaseapp.com",
            projectId: "democraciadirectacl-b75ad",
            storageBucket: "democraciadirectacl-b75ad.appspot.com",
            messagingSenderId: "837131448793",
            appId: "1:837131448793:web:2b5d2acf6e925bac8d29e8"
        };

        // Inicializar Firebase una sola vez
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();

        function App() {
            const [view, setView] = useState('home');
            const [proposals, setProposals] = useState([]);
            const [currentPair, setCurrentPair] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [newIdea, setNewIdea] = useState("");
            const [ideaTitle, setIdeaTitle] = useState("");

            // Carga de datos y autenticación
            useEffect(() => {
                const init = async () => {
                    try {
                        // Login anónimo para cumplir con reglas de seguridad de Firestore
                        await auth.signInAnonymously();
                        
                        // Escucha en tiempo real de las propuestas
                        const unsubscribe = db.collection('proposals')
                            .onSnapshot((snapshot) => {
                                const data = snapshot.docs.map(doc => ({
                                    id: doc.id,
                                    ...doc.data()
                                }));
                                setProposals(data);
                                setLoading(false);
                            }, (err) => {
                                console.error("Error en Firestore:", err);
                                setLoading(false);
                            });

                        return () => unsubscribe();
                    } catch (err) {
                        console.error("Error de conexión:", err);
                        setLoading(false);
                    }
                };
                init();
            }, []);

            // Lógica de Selección de Duelo
            useEffect(() => {
                if (view === 'vote' && currentPair.length === 0 && proposals.length >= 2) {
                    const shuffled = [...proposals].sort(() => 0.5 - Math.random());
                    setCurrentPair(shuffled.slice(0, 2));
                }
            }, [view, currentPair, proposals]);

            // Registrar Voto y actualizar estadísticas
            const handleVote = async (winnerId) => {
                const loserId = currentPair.find(p => p.id !== winnerId)?.id;
                const batch = db.batch();
                
                // Ganador: +1 voto, +1 aparición
                batch.update(db.collection('proposals').doc(winnerId), {
                    votes: firebase.firestore.FieldValue.increment(1),
                    showCount: firebase.firestore.FieldValue.increment(1)
                });

                // Perdedor: +1 aparición (para calcular % de efectividad)
                if (loserId) {
                    batch.update(db.collection('proposals').doc(loserId), {
                        showCount: firebase.firestore.FieldValue.increment(1)
                    });
                }
                
                try {
                    await batch.commit();
                    setCurrentPair([]); // Recargar nuevo duelo
                } catch (e) {
                    console.error("Error al registrar voto:", e);
                }
            };

            // Publicar Iniciativa
            const submitIdea = async (e) => {
                e.preventDefault();
                if (!newIdea.trim() || !ideaTitle.trim()) return;
                
                setIsSubmitting(true);
                try {
                    await db.collection('proposals').add({
                        title: ideaTitle,
                        desc: newIdea,
                        votes: 0,
                        showCount: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    setNewIdea("");
                    setIdeaTitle("");
                    setView('ranking');
                } catch (e) {
                    alert("No se pudo publicar la iniciativa.");
                } finally {
                    setIsSubmitting(false);
                }
            };

            // Ranking calculado
            const rankedProposals = useMemo(() => {
                return [...proposals].sort((a, b) => {
                    const scoreA = a.showCount > 0 ? (a.votes / a.showCount) : 0;
                    const scoreB = b.showCount > 0 ? (b.votes / b.showCount) : 0;
                    return scoreB - scoreA;
                });
            }, [proposals]);

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-[#020617]">
                    <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-[10px] font-bold uppercase tracking-[0.3em] text-indigo-400">Sincronizando Democracia...</p>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col gradient-bg">
                    
                    {/* Navegación Fija */}
                    <nav className="fixed top-0 w-full z-50 px-6 py-4 bg-[#020617]/90 backdrop-blur-md border-b border-white/5">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                                <div className="accent-gradient text-white font-black px-2 py-0.5 rounded text-[10px]">CL</div>
                                <span className="font-extrabold text-xl tracking-tighter uppercase italic">Chile<span className="text-indigo-500 text-glow">Directo</span></span>
                            </div>
                            <div className="flex gap-4 md:gap-8 items-center text-[11px] font-bold uppercase tracking-widest text-slate-400">
                                <button onClick={() => setView('vote')} className={view === 'vote' ? 'text-indigo-400' : 'hover:text-white'}>Votar</button>
                                <button onClick={() => setView('ranking')} className={view === 'ranking' ? 'text-indigo-400' : 'hover:text-white'}>Ranking</button>
                                <button onClick={() => setView('propose')} className="accent-gradient text-white px-4 py-2 rounded-xl shadow-lg hover:scale-105 transition-transform">Proponer</button>
                            </div>
                        </div>
                    </nav>

                    {/* Vistas Dinámicas */}
                    <main className="flex-grow pt-32 pb-20 px-6 max-w-5xl mx-auto w-full animate-fade-in">
                        
                        {view === 'home' && (
                            <div className="text-center py-10 md:py-20 space-y-10">
                                <h1 className="text-5xl md:text-8xl font-black leading-none uppercase tracking-tighter">
                                    El Chile que <br/><span className="text-indigo-500 italic">tú decides.</span>
                                </h1>
                                <p className="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed">
                                    Participa en la toma de decisiones ciudadanas. Tu voto prioriza las leyes e iniciativas que el país necesita hoy.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 justify-center pt-6">
                                    <button onClick={() => setView('vote')} className="bg-white text-slate-950 px-10 py-5 rounded-2xl font-black text-lg shadow-2xl hover:bg-slate-200 transition-all">EMPEZAR A VOTAR</button>
                                    <button onClick={() => setView('propose')} className="glass px-10 py-5 rounded-2xl font-black text-lg border-white/10">SUBIR INICIATIVA</button>
                                </div>
                            </div>
                        )}

                        {view === 'vote' && (
                            <div className="space-y-12">
                                <div className="text-center">
                                    <h2 className="text-3xl font-black italic uppercase tracking-tighter mb-2 text-glow">Prioridad Ciudadana</h2>
                                    <p className="text-slate-500 text-[10px] font-bold uppercase tracking-[0.2em]">Selecciona la propuesta más urgente para el país</p>
                                </div>
                                <div className="grid md:grid-cols-2 gap-8 items-stretch">
                                    {currentPair.length > 0 ? currentPair.map(p => (
                                        <div 
                                            key={p.id} 
                                            onClick={() => handleVote(p.id)} 
                                            className="glass p-10 vote-card flex flex-col justify-between min-h-[350px] border-white/5 hover:border-indigo-500/50"
                                        >
                                            <div>
                                                <div className="w-12 h-12 bg-indigo-500/10 rounded-2xl flex items-center justify-center mb-6">
                                                    <span className="text-indigo-400 font-bold text-xl">?</span>
                                                </div>
                                                <h3 className="text-2xl font-extrabold uppercase mb-4 leading-tight tracking-tight">{p.title}</h3>
                                                <p className="text-slate-400 text-base leading-relaxed line-clamp-6">{p.desc}</p>
                                            </div>
                                            <div className="mt-8 flex items-center gap-2">
                                                <div className="h-[1px] flex-grow bg-white/5"></div>
                                                <span className="text-[9px] font-black uppercase tracking-widest text-indigo-500">Confirmar Prioridad</span>
                                            </div>
                                        </div>
                                    )) : (
                                        <div className="col-span-2 text-center py-20 glass border-dashed">
                                            <p className="text-slate-500 font-bold uppercase italic tracking-widest">Buscando propuestas en el sistema...</p>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        {view === 'ranking' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <div className="flex justify-between items-end mb-8">
                                    <h2 className="text-4xl font-black italic uppercase tracking-tighter">Ranking <span className="text-indigo-500 ml-2">Digital</span></h2>
                                    <p className="text-[10px] text-slate-500 font-bold uppercase tracking-widest pb-1">{proposals.length} Iniciativas activas</p>
                                </div>
                                {rankedProposals.length > 0 ? rankedProposals.map((p, i) => (
                                    <div key={p.id} className="glass p-6 flex items-center justify-between hover:bg-white/[0.02]">
                                        <div className="flex items-center gap-6">
                                            <span className="text-4xl font-black text-slate-800 italic w-12 text-center">#{i+1}</span>
                                            <div>
                                                <h3 className="font-extrabold uppercase text-sm tracking-tight">{p.title}</h3>
                                                <div className="flex gap-4 mt-1">
                                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest">{p.votes} Votos</p>
                                                    <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest">{p.showCount} Apariciones</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-indigo-400 font-black text-3xl italic leading-none">
                                                {p.showCount > 0 ? Math.round((p.votes / p.showCount) * 100) : 0}%
                                            </div>
                                            <p className="text-[8px] font-bold text-slate-600 uppercase mt-1">Aprobación</p>
                                        </div>
                                    </div>
                                )) : <div className="text-center py-20 glass text-slate-600 font-bold uppercase italic text-xs">Aún no hay propuestas registradas</div>}
                            </div>
                        )}

                        {view === 'propose' && (
                            <div className="max-w-2xl mx-auto space-y-10">
                                <div className="text-center space-y-4">
                                    <h2 className="text-5xl font-black italic uppercase tracking-tighter">Tu Propuesta</h2>
                                    <p className="text-slate-400 font-medium">Define un cambio positivo para el país. Será sometido a votación nacional.</p>
                                </div>
                                <form onSubmit={submitIdea} className="glass p-8 md:p-12 space-y-8 shadow-2xl relative overflow-hidden">
                                    <div className="absolute top-0 right-0 w-32 h-32 accent-gradient opacity-5 rounded-full blur-3xl -mr-16 -mt-16"></div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Título Corto</label>
                                        <input 
                                            className="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-indigo-500 transition-all font-bold text-lg"
                                            placeholder="Ej: Reforma Salud Digital"
                                            value={ideaTitle}
                                            onChange={(e) => setIdeaTitle(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Explicación del proyecto</label>
                                        <textarea 
                                            className="w-full h-48 bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-indigo-500 transition-all resize-none text-base font-medium"
                                            placeholder="Describe cómo este cambio beneficia a la ciudadanía..."
                                            value={newIdea}
                                            onChange={(e) => setNewIdea(e.target.value)}
                                            required
                                        />
                                    </div>
                                    <button 
                                        type="submit" 
                                        disabled={isSubmitting}
                                        className="w-full bg-white text-slate-950 py-6 rounded-2xl font-black text-xl hover:bg-indigo-500 hover:text-white transition-all shadow-xl flex items-center justify-center gap-3 disabled:opacity-50"
                                    >
                                        {isSubmitting ? (
                                            <>
                                                <div className="w-5 h-5 border-4 border-slate-900 border-t-transparent rounded-full animate-spin"></div>
                                                PUBLICANDO...
                                            </>
                                        ) : 'LANZAR INICIATIVA'}
                                    </button>
                                </form>
                            </div>
                        )}
                    </main>

                    <footer className="py-12 border-t border-white/5 bg-[#010410]">
                        <div className="max-w-6xl mx-auto px-6 flex flex-col items-center gap-6">
                            <div className="flex items-center gap-2 opacity-30 grayscale">
                                <div className="bg-white text-black font-black px-2 py-0.5 rounded text-[10px]">CL</div>
                                <span className="font-bold text-lg tracking-tighter uppercase italic">ChileDirecto</span>
                            </div>
                            <div className="text-[10px] font-bold text-slate-700 uppercase tracking-[0.6em] text-center">
                                Democracia Directa Digital 2026
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

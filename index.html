<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracia Directa CL - Plataforma Ciudadana</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .perspective-1000 { perspective: 1000px; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Importación dinámica de Firebase desde CDN para compatibilidad total en un solo archivo
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, collection, doc, onSnapshot, updateDoc, increment, addDoc, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";

        // --- CONFIGURACIÓN ---
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'democracia-directa-cl';
        const apiKey = ""; 

        // Iconos auxiliares (simulando Lucide en React)
        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { lucide.createIcons(); }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        function App() {
            const [user, setUser] = useState(null);
            const [ideas, setIdeas] = useState([]);
            const [currentPair, setCurrentPair] = useState([]);
            const [isAddingIdea, setIsAddingIdea] = useState(false);
            const [view, setView] = useState('landing'); 
            const [newIdeaText, setNewIdeaText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [message, setMessage] = useState(null);

            // 1. Autenticación
            useEffect(() => {
                const initAuth = async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await signInWithCustomToken(auth, __initial_auth_token);
                        } else {
                            await signInAnonymously(auth);
                        }
                    } catch (err) {
                        console.error("Auth Error:", err);
                    }
                };
                initAuth();
                const unsubscribe = onAuthStateChanged(auth, setUser);
                return () => unsubscribe();
            }, []);

            // 2. Datos
            useEffect(() => {
                if (!user) return;
                const ideasRef = collection(db, 'artifacts', appId, 'public', 'data', 'ideas');
                const unsubscribe = onSnapshot(query(ideasRef), (snapshot) => {
                    const ideasList = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setIdeas(ideasList);
                    if (ideasList.length >= 2 && currentPair.length === 0) {
                        const shuffled = [...ideasList].sort(() => 0.5 - Math.random());
                        setCurrentPair([shuffled[0], shuffled[1]]);
                    }
                }, (error) => console.error(error));
                return () => unsubscribe();
            }, [user]);

            const handleVote = async (winnerId) => {
                if (!user) return;
                try {
                    const winnerRef = doc(db, 'artifacts', appId, 'public', 'data', 'ideas', winnerId);
                    await updateDoc(winnerRef, { votes: increment(1), appearances: increment(1) });
                    const loser = currentPair.find(i => i.id !== winnerId);
                    if (loser) {
                        const loserRef = doc(db, 'artifacts', appId, 'public', 'data', 'ideas', loser.id);
                        await updateDoc(loserRef, { appearances: increment(1) });
                    }
                    setMessage({ type: 'success', text: 'Voto procesado en la red' });
                    setTimeout(() => setMessage(null), 1500);
                    const shuffled = [...ideas].sort(() => 0.5 - Math.random());
                    setCurrentPair([shuffled[0], shuffled[1]]);
                } catch (err) { console.error(err); }
            };

            const handleAddIdea = async (e) => {
                e.preventDefault();
                if (!newIdeaText.trim() || isGenerating) return;
                setIsGenerating(true);
                try {
                    const systemPrompt = "Eres un redactor neutral para Democracia Directa CL. Redacta un título corto y descripción objetiva de 2 frases.";
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: `Idea: "${newIdeaText}"` }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });
                    const result = await response.json();
                    const aiText = result.candidates?.[0]?.content?.parts?.[0]?.text || "Descripción técnica generada.";
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'ideas'), {
                        title: newIdeaText.toUpperCase(),
                        description: aiText,
                        votes: 0,
                        appearances: 0,
                        createdAt: Date.now()
                    });
                    setNewIdeaText('');
                    setIsAddingIdea(false);
                    setMessage({ type: 'success', text: 'Propuesta publicada' });
                } catch (err) { setMessage({ type: 'error', text: 'Error de conexión' }); }
                finally { setIsGenerating(false); setTimeout(() => setMessage(null), 3000); }
            };

            const sortedRanking = useMemo(() => {
                return [...ideas].sort((a, b) => {
                    const ratioA = a.appearances > 0 ? a.votes / a.appearances : 0;
                    const ratioB = b.appearances > 0 ? b.votes / b.appearances : 0;
                    return ratioB - ratioA;
                });
            }, [ideas]);

            if (view === 'landing') {
                return (
                    <div className="min-h-screen">
                        <nav className="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-slate-200 px-8 py-5 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="bg-slate-900 p-1.5 rounded-lg"><Icon name="fingerprint" className="text-cyan-400" /></div>
                                <span className="text-xl font-black uppercase tracking-tighter">Democracia Directa CL</span>
                            </div>
                            <button onClick={() => setView('vote')} className="px-6 py-2 bg-slate-900 text-white rounded-full font-bold hover:bg-slate-800 transition-all text-sm">Entrar</button>
                        </nav>
                        <header className="pt-48 pb-20 px-6 text-center max-w-4xl mx-auto space-y-10 animate-fade-in">
                            <div className="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-full text-[10px] font-black uppercase tracking-widest shadow-sm">
                                <Icon name="sparkles" size={14} className="text-cyan-500" /> Soberanía Digital
                            </div>
                            <h1 className="text-7xl md:text-8xl font-black tracking-tighter text-slate-900 leading-[0.85]">
                                Ideas <span className="text-cyan-500 italic">puras</span>.<br/>Poder <span className="underline decoration-slate-300 underline-offset-4">real</span>.
                            </h1>
                            <p className="text-xl text-slate-500 font-medium leading-relaxed max-w-2xl mx-auto">
                                La primera plataforma de votación binaria en Chile donde la IA garantiza la neutralidad de cada propuesta.
                            </p>
                            <div className="flex justify-center gap-4">
                                <button onClick={() => setView('vote')} className="px-10 py-5 bg-slate-900 text-white rounded-2xl font-black text-lg hover:bg-cyan-500 transition-all shadow-xl flex items-center gap-2">Votar Ahora <Icon name="chevron-right" /></button>
                                <button onClick={() => setView('ranking')} className="px-10 py-5 bg-white border border-slate-200 text-slate-700 rounded-2xl font-black text-lg hover:border-slate-900 transition-all">Ranking</button>
                            </div>
                        </header>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    <nav className="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
                        <div onClick={() => setView('landing')} className="flex items-center gap-2 cursor-pointer">
                            <div className="bg-slate-900 p-1 rounded-md"><Icon name="fingerprint" size={16} className="text-cyan-400" /></div>
                            <h1 className="text-sm font-black uppercase tracking-tighter">Democracia Directa CL</h1>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-xl">
                            <button onClick={() => setView('vote')} className={`px-5 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${view === 'vote' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>Duelos</button>
                            <button onClick={() => setView('ranking')} className={`px-5 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${view === 'ranking' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>Consenso</button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-6 md:p-10 animate-fade-in">
                        {message && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 bg-slate-900 text-white rounded-2xl shadow-2xl flex items-center gap-3">
                                <Icon name={message.type === 'success' ? "check-circle" : "alert-circle"} size={18} className="text-cyan-400" />
                                <span className="text-[10px] font-black uppercase tracking-widest">{message.text}</span>
                            </div>
                        )}

                        {view === 'vote' ? (
                            <div className="space-y-12 py-4">
                                <div className="text-center space-y-2">
                                    <h2 className="text-4xl font-black uppercase tracking-tight">Duelo de Prioridades</h2>
                                    <p className="text-slate-400 text-xs font-bold uppercase tracking-[0.2em]">Pasa el mouse para ver el análisis de la IA</p>
                                </div>

                                {currentPair.length === 2 ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        {currentPair.map((idea, idx) => (
                                            <div key={idea.id} className="relative group perspective-1000 h-80">
                                                <button
                                                    onClick={() => handleVote(idea.id)}
                                                    className="w-full h-full bg-white border-2 border-slate-200 rounded-[2.5rem] p-10 flex items-center justify-center text-center shadow-sm hover:shadow-2xl hover:border-cyan-400 transition-all duration-500 overflow-hidden relative"
                                                >
                                                    <span className="text-xl font-black text-slate-900 uppercase tracking-tighter group-hover:opacity-0 transition-opacity">
                                                        {idea.title}
                                                    </span>
                                                    <div className="absolute inset-0 p-8 flex flex-col justify-center items-center bg-slate-900 text-white opacity-0 group-hover:opacity-100 transition-opacity duration-300">
                                                       <Icon name="sparkles" size={24} className="mb-4 text-cyan-400" />
                                                       <p className="text-xs font-medium leading-relaxed italic opacity-90">{idea.description}</p>
                                                       <div className="mt-6 flex items-center gap-2 bg-white/10 px-4 py-2 rounded-full text-[9px] font-black uppercase tracking-[0.2em]">Click para votar</div>
                                                    </div>
                                                </button>
                                                {idx === 0 && <div className="hidden md:flex absolute -right-10 top-1/2 -translate-y-1/2 bg-white border-2 border-slate-100 text-slate-300 w-10 h-10 rounded-full items-center justify-center font-black z-10 shadow-sm italic text-xs">VS</div>}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-40 text-slate-300 font-black uppercase tracking-widest text-xs animate-pulse">Sincronizando...</div>
                                )}

                                <div className="pt-10 flex justify-center border-t border-slate-200">
                                    <button onClick={() => setIsAddingIdea(true)} className="px-8 py-4 bg-slate-900 text-white rounded-2xl font-black hover:bg-slate-800 transition-all shadow-xl flex items-center gap-2 uppercase tracking-widest text-xs">
                                        <Icon name="plus" size={18} className="text-cyan-400" /> Proponer nueva idea
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-8 py-4">
                                <div className="space-y-2 border-b border-slate-200 pb-8">
                                    <h2 className="text-5xl font-black tracking-tighter uppercase">Consenso Nacional</h2>
                                    <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Pasa el mouse sobre el título para leer el contexto</p>
                                </div>
                                <div className="grid gap-4">
                                    {sortedRanking.map((idea, index) => {
                                        const ratio = idea.appearances > 0 ? Math.round((idea.votes / idea.appearances) * 100) : 0;
                                        return (
                                            <div key={idea.id} className="bg-white border border-slate-200 p-8 rounded-[2rem] flex items-center gap-6 shadow-sm hover:shadow-lg transition-all group relative overflow-visible">
                                                <div className={`w-14 h-14 rounded-xl flex items-center justify-center text-xl font-black ${index < 3 ? 'bg-slate-900 text-cyan-400' : 'bg-slate-50 text-slate-300'}`}>{index + 1}</div>
                                                <div className="flex-grow relative">
                                                    <h3 className="text-lg font-black uppercase tracking-tight cursor-help">{idea.title}</h3>
                                                    <div className="absolute left-0 top-full mt-2 w-72 bg-slate-900 text-white p-5 rounded-2xl text-[11px] font-medium shadow-2xl opacity-0 scale-95 group-hover:opacity-100 group-hover:scale-100 transition-all z-[100] pointer-events-none border border-white/10">
                                                        <p className="italic leading-relaxed">{idea.description}</p>
                                                    </div>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-3xl font-black leading-none">{ratio}%</div>
                                                    <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Prioridad</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {isAddingIdea && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[200] flex items-center justify-center p-6">
                            <form onSubmit={handleAddIdea} className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl scale-in-center">
                                <div className="p-10 space-y-8">
                                    <div className="flex justify-between items-start">
                                        <h3 className="text-2xl font-black uppercase tracking-tight">Nueva Propuesta</h3>
                                        <button type="button" onClick={() => setIsAddingIdea(false)} className="text-slate-300 hover:text-slate-900 transition-colors"><Icon name="x" size={24} /></button>
                                    </div>
                                    <input 
                                        autoFocus required
                                        placeholder="Ej: Reforma de Salud Rural..."
                                        value={newIdeaText}
                                        onChange={(e) => setNewIdeaText(e.target.value)}
                                        className="w-full p-6 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-cyan-400 focus:outline-none text-xl font-bold placeholder:text-slate-200"
                                    />
                                    {isGenerating && (
                                        <div className="flex items-center gap-3 text-cyan-600 font-black text-[10px] uppercase tracking-widest">
                                            <Icon name="sparkles" className="animate-spin" /> Neutralizando conceptos...
                                        </div>
                                    )}
                                </div>
                                <div className="p-6 bg-slate-50 flex gap-4 border-t border-slate-100">
                                    <button type="button" onClick={() => setIsAddingIdea(false)} className="flex-1 py-4 font-black text-slate-400 uppercase text-[10px] tracking-widest">Cerrar</button>
                                    <button disabled={isGenerating || !newIdeaText.trim()} type="submit" className="flex-[2] py-4 bg-slate-900 text-white font-black rounded-xl hover:bg-cyan-500 transition-all uppercase text-[10px] tracking-widest">Enviar Propuesta</button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

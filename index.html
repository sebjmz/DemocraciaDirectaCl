<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracia Directa</title>
    
    <!-- 1. Tailwind CSS para los estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. React y Babel (para que el navegador entienda JSX) -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- 3. Lucide Icons (Versión para navegador) -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Importamos Firebase desde el CDN de módulos -->
    <script type="importmap">
    {
      "imports": {
        "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
        "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js",
        "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js"
      }
    }
    </script>

    <script type="text/babel" data-type="module">
        import { initializeApp } from 'firebase/app';
        import { getFirestore, collection, doc, setDoc, onSnapshot, updateDoc, increment, query } from 'firebase/firestore';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';

        // Extraemos los hooks de React del objeto global
        const { useState, useEffect, useMemo } = React;

        // Componente de Iconos (Simulación de Lucide-React para navegador)
        const Icon = ({ name, size = 24, className = "" }) => {
            useEffect(() => {
                lucide.createIcons();
            }, [name]);
            return <i data-lucide={name} style={{width: size, height: size}} className={className}></i>;
        };

        // --- TU CONFIGURACIÓN DE FIREBASE ---
        const firebaseConfig = {
            apiKey: "REEMPLAZAR_CON_TU_API_KEY",
            authDomain: "TU_PROYECTO.firebaseapp.com",
            projectId: "TU_PROYECTO_ID",
            storageBucket: "TU_PROYECTO.appspot.com",
            messagingSenderId: "TU_ID",
            appId: "TU_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'democracia-directa-cl';
        const geminiApiKey = "TU_GEMINI_API_KEY"; 

        function App() {
            const [user, setUser] = useState(null);
            const [proposals, setProposals] = useState([]);
            const [currentPair, setCurrentPair] = useState([]);
            const [view, setView] = useState('home'); 
            const [loading, setLoading] = useState(true);
            const [submitting, setSubmitting] = useState(false);
            const [newIdea, setNewIdea] = useState("");
            const [error, setError] = useState(null);

            // [AQUÍ VA TODA TU LÓGICA DE USEEFFECT Y FUNCIONES QUE YA ESCRIBISTE]
            // Nota: Cambia los componentes de Lucide como <Scale /> por <Icon name="scale" />

            useEffect(() => {
                signInAnonymously(auth).catch(console.error);
                return onAuthStateChanged(auth, setUser);
            }, []);

            useEffect(() => {
                if (!user) return;
                const q = query(collection(db, 'artifacts', appId, 'public', 'data', 'proposals'));
                return onSnapshot(q, (snapshot) => {
                    setProposals(snapshot.docs.map(d => ({ id: d.id, ...d.data() })));
                    setLoading(false);
                });
            }, [user]);

            // ... (Resto de tu lógica: handleVote, submitIdea, sortedRanking)

            if (loading) return (
                <div className="min-h-screen bg-white flex flex-col items-center justify-center">
                    <Icon name="loader-2" className="animate-spin text-indigo-600" size={40} />
                    <p className="mt-4 text-[10px] font-black uppercase tracking-widest text-slate-400">Sincronizando...</p>
                </div>
            );

            return (
                <div className="min-h-screen bg-[#fafafa] text-slate-900">
                    {/* Ejemplo de Navbar usando el componente Icon */}
                    <nav className="fixed top-0 w-full z-50 bg-white/80 backdrop-blur-md border-b border-slate-100">
                        <div className="max-w-6xl mx-auto px-6 h-16 flex items-center justify-between">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                                <div className="bg-slate-900 p-1.5 rounded-lg text-white flex">
                                    <Icon name="scale" size={18} />
                                </div>
                                <span className="text-sm font-black tracking-tighter uppercase">Democracia<span className="text-indigo-600">Directa</span></span>
                            </div>
                            <div className="flex items-center gap-6">
                                <button onClick={() => setView('vote')} className="text-[10px] font-bold uppercase tracking-wider">Votar</button>
                                <button onClick={() => setView('ranking')} className="text-[10px] font-bold uppercase tracking-wider">Ranking</button>
                                <button onClick={() => setView('propose')} className="bg-indigo-600 text-white px-4 py-2 rounded-full text-[10px] font-bold uppercase">Proponer</button>
                            </div>
                        </div>
                    </nav>

                    <main className="pt-32 pb-24 px-6 max-w-5xl mx-auto">
                        {/* Renderizado de vistas (Home, Vote, Ranking, etc.) */}
                        <h1 className="text-4xl font-black">Chile decide sin filtros.</h1>
                        <p>Contenido cargado desde React en un solo archivo HTML.</p>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

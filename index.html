<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACIADIRECTACL | El Mandato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWxTFJGOFesMgIyp5C65qQEnFr5_dCxcU",
            authDomain: "democraciadirectacl-b75ad.firebaseapp.com",
            projectId: "democraciadirectacl-b75ad",
            storageBucket: "democraciadirectacl-b75ad.firebasestorage.app",
            messagingSenderId: "837131448793",
            appId: "1:837131448793:web:2b5d2aef6e925bac8d29c8"
        };

        const appId = 'democraciadirectacl';
        const apiKey = ""; 
        let db, auth, user;
        let todasLasPropuestas = [];
        let vistaActual = 'landing';
        let cargandoVoto = false;
        let totalVotosGlobal = 0;
        let dueloActualIds = []; 

        const propuestasSemilla = [
            { id: "seed1", titulo: "FIN AL CAE", descripcion: "Condonación total e inmediata de la deuda educativa.", votos: 142 },
            { id: "seed2", titulo: "CÁRCEL EFECTIVA", descripcion: "No más beneficios para delitos violentos y corrupción.", votos: 98 },
            { id: "seed3", titulo: "AGUA CIUDADANA", descripcion: "Nacionalización total de los derechos de agua.", votos: 215 }
        ];

        async function conectarFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (u) => {
                    if (u) {
                        user = u;
                        escucharDatos();
                    }
                });
            } catch (e) { 
                todasLasPropuestas = propuestasSemilla;
                actualizarComponentes();
            }
        }

        function escucharDatos() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'propuestas');
            onSnapshot(colRef, (snapshot) => {
                let total = 0;
                let nuevasPropuestas = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    total += (data.votos || 0);
                    nuevasPropuestas.push({ id: doc.id, ...data });
                });
                
                todasLasPropuestas = nuevasPropuestas.length > 0 ? nuevasPropuestas : propuestasSemilla;
                totalVotosGlobal = total || (nuevasPropuestas.length === 0 ? 455 : total);
                actualizarComponentes();
            }, (error) => {
                todasLasPropuestas = propuestasSemilla;
                actualizarComponentes();
            });
        }

        function actualizarComponentes() {
            document.querySelectorAll('.contador-votos-tiempo-real').forEach(c => {
                c.innerText = totalVotosGlobal.toLocaleString();
            });
            if (vistaActual === 'ranking') renderizarRanking();
            if (vistaActual === 'duelo' && dueloActualIds.length === 0) presentarNuevoDuelo();
        }

        window.entrarALaArena = () => {
            vistaActual = 'duelo';
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.remove('hidden');
            presentarNuevoDuelo();
            window.scrollTo(0, 0);
        };

        window.navegar = (vista) => {
            vistaActual = vista;
            document.getElementById('seccion-duelo').classList.toggle('hidden', vista !== 'duelo');
            document.getElementById('seccion-ranking').classList.toggle('hidden', vista !== 'ranking');
            
            const btnDuelo = document.getElementById('nav-duelo');
            const btnRanking = document.getElementById('nav-ranking');
            
            if (vista === 'duelo') {
                btnDuelo.className = 'nav-btn active-nav rounded-2xl';
                btnRanking.className = 'nav-btn inactive-nav rounded-2xl';
                document.body.style.backgroundColor = "#f4f7fa";
            } else {
                btnDuelo.className = 'nav-btn inactive-nav rounded-2xl';
                btnRanking.className = 'nav-btn active-nav rounded-2xl';
                document.body.style.backgroundColor = "#ffffff";
            }
            
            if (vista === 'ranking') renderizarRanking();
            if (vista === 'duelo' && dueloActualIds.length === 0) presentarNuevoDuelo();
            window.scrollTo(0, 0);
        };

        async function procesarConIA(texto) {
            try {
                const systemPrompt = `Eres un sintetizador de voluntad popular crudo.
                TU OBJETIVO: 
                1. Genera un TITULO de MAXIMO 3 palabras en MAYÚSCULAS. Debe ser el núcleo de la idea.
                2. Genera una DESCRIPCIÓN de una sola frase corta, clara y sin adornos.
                3. Si el texto es ofensivo o ilegal, responde: {"error": true}.
                FORMATO JSON: {"titulo":"EJEMPLO TITULO", "descripcion":"Ejemplo de descripcion directa."}`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: texto }] }], 
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { 
                            responseMimeType: "application/json",
                            temperature: 0.2
                        } 
                    })
                });
                const data = await response.json();
                const result = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || "{}");
                
                if (result.error) return null;
                return result;
            } catch (e) { 
                return { titulo: "NUEVA PROPUESTA", descripcion: texto.substring(0, 60) }; 
            }
        }

        window.enviarPropuesta = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-idea');
            const btn = document.getElementById('btn-publicar');
            const timerDiv = document.getElementById('timer-ui');
            const secsSpan = document.getElementById('timer-secs');
            const feedback = document.getElementById('form-feedback');
            const texto = input.value.trim();
            
            if (!texto || !user || btn.disabled) return;

            // Bloquear UI
            btn.disabled = true;
            input.disabled = true;
            feedback.classList.add('hidden');
            
            // Iniciar Contador de 10 Segundos
            let timeLeft = 10;
            timerDiv.classList.remove('hidden');
            secsSpan.innerText = timeLeft;
            btn.innerHTML = `Sintetizando voluntad...`;

            // Ejecutar IA en paralelo
            const tareaIA = procesarConIA(texto);

            const interval = setInterval(() => {
                timeLeft--;
                if (secsSpan) secsSpan.innerText = timeLeft;
                if (timeLeft <= 0) clearInterval(interval);
            }, 1000);

            // Esperar los 10 segundos exactos para dar sensación de rigor
            setTimeout(async () => {
                const resumen = await tareaIA;
                
                if (!resumen) {
                    clearInterval(interval);
                    timerDiv.classList.add('hidden');
                    btn.disabled = false;
                    input.disabled = false;
                    btn.innerHTML = `Reintentar Lanzamiento <i class="fas fa-redo ml-4"></i>`;
                    feedback.innerText = "CONTENIDO RECHAZADO: DEBE SER UNA PROPUESTA CIUDADANA VÁLIDA.";
                    feedback.classList.remove('hidden');
                    return;
                }

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'propuestas'), {
                        ...resumen,
                        votos: 1,
                        creado: serverTimestamp(),
                        uid: user.uid
                    });
                    
                    input.value = "";
                    input.disabled = false;
                    btn.disabled = false;
                    btn.innerHTML = `Lanzar a Debate <i class="fas fa-paper-plane ml-4 text-orange-500"></i>`;
                    timerDiv.classList.add('hidden');
                    window.navegar('ranking');
                } catch (err) {
                    btn.disabled = false;
                    input.disabled = false;
                    timerDiv.classList.add('hidden');
                }
            }, 10000);
        };

        function presentarNuevoDuelo() {
            const container = document.getElementById('contenedor-duelo');
            if (todasLasPropuestas.length < 2) {
                container.innerHTML = `<div class="p-20 text-center animate-pulse text-indigo-400 font-black italic uppercase tracking-widest">Sincronizando voluntades...</div>`;
                return;
            }

            const shuffled = [...todasLasPropuestas].sort(() => 0.5 - Math.random());
            const seleccionadas = shuffled.slice(0, 2);
            dueloActualIds = seleccionadas.map(p => p.id);

            const card = (p, label, colorClass) => `
                <button onclick="votar('${p.id}')" class="group relative p-8 bg-white border-b-[8px] border-slate-200 rounded-[2.5rem] hover:border-orange-500 hover:shadow-2xl transition-all text-left flex flex-col min-h-[350px] w-full animate-fade overflow-hidden">
                    <div class="absolute top-0 right-0 w-24 h-24 bg-slate-50 rounded-bl-full -mr-12 -mt-12 group-hover:bg-orange-50 transition-colors"></div>
                    <div class="flex justify-between items-center mb-8 relative z-10">
                        <span class="text-[10px] font-black text-white ${colorClass} px-5 py-1.5 rounded-full uppercase tracking-[0.2em] shadow-md">${label}</span>
                        <div class="h-12 w-12 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition-all transform group-hover:scale-110 shadow-sm">
                            <i class="fas fa-check-circle text-xl"></i>
                        </div>
                    </div>
                    <h3 class="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter mb-6 leading-[0.9] uppercase group-hover:text-indigo-600 transition-colors relative z-10">${p.titulo}</h3>
                    <p class="text-lg md:text-xl text-slate-500 font-semibold leading-snug flex-grow relative z-10">${p.descripcion}</p>
                    <div class="mt-6 pt-6 border-t border-slate-100 flex items-center justify-between relative z-10">
                        <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest italic">Haz clic para decidir</span>
                    </div>
                </button>
            `;

            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8 relative">
                    ${card(seleccionadas[0], 'OPCIÓN A', 'bg-indigo-600')}
                    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-20 w-20 h-20 bg-orange-600 text-white items-center justify-center rounded-2xl font-black italic border-[8px] border-[#f4f7fa] shadow-2xl rotate-12">VS</div>
                    ${card(seleccionadas[1], 'OPCIÓN B', 'bg-slate-900')}
                </div>
            `;
        }

        window.votar = async (id) => {
            if (cargandoVoto) return;
            cargandoVoto = true;
            document.getElementById('contenedor-duelo').style.opacity = "0.3";
            try {
                if (!id.startsWith('seed')) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'propuestas', id);
                    await updateDoc(docRef, { votos: increment(1) });
                }
                setTimeout(() => {
                    dueloActualIds = []; 
                    presentarNuevoDuelo();
                    document.getElementById('contenedor-duelo').style.opacity = "1";
                    cargandoVoto = false;
                }, 400);
            } catch (e) {
                document.getElementById('contenedor-duelo').style.opacity = "1";
                cargandoVoto = false;
            }
        };

        function renderizarRanking() {
            const container = document.getElementById('lista-ranking');
            const sorted = [...todasLasPropuestas].sort((a,b) => (b.votos || 0) - (a.votos || 0)).slice(0, 30);
            const maxVotosLider = sorted.length > 0 ? (sorted[0].votos || 0) : 0;

            container.innerHTML = sorted.map((p, i) => {
                const votosPropuesta = p.votos || 0;
                const apoyoGlobalPct = totalVotosGlobal > 0 ? ((votosPropuesta / totalVotosGlobal) * 100).toFixed(1) : "0.0";
                const barraIntensidadPct = maxVotosLider > 0 ? ((votosPropuesta / maxVotosLider) * 100) : 0;

                return `
                <div class="bg-slate-50 p-8 rounded-[3rem] mb-8 border-l-[10px] border-indigo-600 flex flex-col md:flex-row items-center gap-8 shadow-sm animate-fade">
                    <span class="text-6xl font-black text-slate-200 w-24 text-center italic">#${i+1}</span>
                    <div class="flex-1 w-full text-left">
                        <h4 class="font-black text-slate-900 uppercase text-3xl mb-2 tracking-tighter leading-none">${p.titulo}</h4>
                        <p class="text-slate-500 font-bold text-base mb-6">${p.descripcion}</p>
                        <div class="w-full h-4 bg-white rounded-full overflow-hidden border-2 border-white">
                            <div class="h-full bg-indigo-600 rounded-full transition-all duration-1000" style="width: ${barraIntensidadPct}%"></div>
                        </div>
                    </div>
                    <div class="text-center md:text-right bg-white px-8 py-6 rounded-[2rem] shadow-sm min-w-[150px]">
                        <span class="block text-4xl font-black text-indigo-900 leading-none">${apoyoGlobalPct}%</span>
                        <span class="text-[9px] font-black text-slate-400 uppercase tracking-widest mt-2 block">APOYO</span>
                    </div>
                </div>
            `}).join('');
        }

        window.onload = conectarFirebase;

    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fa; }
        h1, .hero-title { font-family: 'Merriweather', serif; font-weight: 900; }
        .nav-btn { @apply px-12 py-4 font-black text-[12px] uppercase tracking-[0.4em] border-b-[4px] transition-all duration-300; }
        .active-nav { @apply text-indigo-600 border-indigo-600; }
        .inactive-nav { @apply text-slate-300 border-transparent hover:text-slate-500 hover:bg-slate-100/50; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fade-in 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .timer-progress { border: 6px solid #f3f4f6; border-top: 6px solid #f97316; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="selection:bg-orange-500 selection:text-white overflow-x-hidden">

    <!-- LANDING PAGE -->
    <div id="landing-page" class="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-white relative">
        <h1 class="text-6xl sm:text-7xl md:text-8xl font-black text-[#050a1e] tracking-tighter mb-12 hero-title animate-fade">Chile es<br><span class="italic text-indigo-600">tu mandato</span>.</h1>
        <button onclick="entrarALaArena()" class="px-16 py-8 bg-slate-900 text-white font-black rounded-full hover:bg-indigo-600 transition-all uppercase tracking-[0.5em] text-sm shadow-2xl hover:scale-105 active:scale-95">Entrar a Decidir</button>
    </div>

    <!-- APP INTERFACE -->
    <div id="app-interface" class="hidden min-h-screen flex flex-col">
        <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur-3xl border-b border-slate-100 px-8 py-4">
            <div class="max-w-7xl mx-auto flex flex-col lg:flex-row justify-between items-center gap-6">
                <div class="font-black text-2xl tracking-tighter uppercase italic">DEMOCRACIA<span class="text-indigo-600">DIRECTACL</span></div>
                <div class="flex bg-slate-100 p-2 rounded-3xl gap-2">
                    <button id="nav-duelo" onclick="navegar('duelo')" class="nav-btn active-nav rounded-2xl">Decidir</button>
                    <button id="nav-ranking" onclick="navegar('ranking')" class="nav-btn inactive-nav rounded-2xl">Ranking</button>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-6xl mx-auto w-full p-6 py-16">
            <div id="seccion-duelo" class="animate-fade">
                <div id="contenedor-duelo" class="mb-24 min-h-[400px]"></div>
                
                <div class="max-w-3xl mx-auto">
                    <div class="bg-white p-10 md:p-16 rounded-[4rem] shadow-2xl relative border-t-[12px] border-orange-500">
                        <form onsubmit="enviarPropuesta(event)">
                            <h3 class="text-center font-black uppercase tracking-[0.3em] text-[10px] text-slate-400 mb-8">Redacción de Mandato Crudo</h3>
                            <textarea id="input-idea" rows="2" placeholder="Escribe aquí tu visión para el país..." class="w-full p-10 bg-slate-50 rounded-[2.5rem] border-none text-2xl font-black mb-10 resize-none focus:ring-0 leading-tight placeholder:text-slate-200"></textarea>
                            
                            <p id="form-feedback" class="hidden mb-10 text-[10px] font-black text-white bg-red-600 p-6 rounded-3xl animate-fade uppercase tracking-widest text-center"></p>

                            <!-- UI DE CONTADOR (10 Segundos) -->
                            <div id="timer-ui" class="hidden mb-10 text-center animate-fade">
                                <div class="flex flex-col items-center gap-6 bg-slate-900 p-10 rounded-[3rem] text-white">
                                    <div class="timer-progress"></div>
                                    <div class="flex flex-col gap-1">
                                        <span class="text-5xl font-black text-orange-500" id="timer-secs">10</span>
                                        <span class="text-[9px] font-black uppercase tracking-[0.4em] opacity-60">Segundos para la síntesis</span>
                                    </div>
                                    <p class="text-[11px] font-bold italic text-slate-400">La IA está estructurando tu idea en un mandato claro y ejecutable.</p>
                                </div>
                            </div>

                            <button id="btn-publicar" type="submit" class="w-full bg-slate-900 text-white py-10 rounded-[2.5rem] font-black text-xl uppercase tracking-[0.4em] hover:bg-indigo-600 transition-all shadow-2xl active:scale-95 disabled:opacity-50">
                                Lanzar a Debate <i class="fas fa-paper-plane ml-4 text-orange-500"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="seccion-ranking" class="hidden animate-fade">
                <div id="lista-ranking" class="max-w-5xl mx-auto pb-48"></div>
            </div>
        </main>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACIADIRECTACL | La Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWxTFJGOFesMgIyp5C65qQEnFr5_dCxcU",
            authDomain: "democraciadirectacl-b75ad.firebaseapp.com",
            projectId: "democraciadirectacl-b75ad",
            storageBucket: "democraciadirectacl-b75ad.firebasestorage.app",
            messagingSenderId: "837131448793",
            appId: "1:837131448793:web:2b5d2aef6e925bac8d29c8"
        };

        const appId = 'democraciadirectacl';
        const apiKey = ""; 
        let db, auth, user;
        let todasLasPropuestas = [];
        let vistaActual = 'landing';
        let cargandoDuelo = false;
        let totalVotosGlobal = 0;

        const frasesHero = [
            "La soberanía no se delega, se ejerce.",
            "Tu voz es el único filtro que Chile necesita.",
            "Construyendo el primer consenso digital en tiempo real.",
            "Donde las ideas compiten por su valor, no por su autor.",
            "Democracia sin intermediarios, impulsada por ti."
        ];

        // --- INICIALIZACIÓN ---
        async function conectarFirebase() {
            const app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
            await signInAnonymously(auth);
            onAuthStateChanged(auth, (u) => {
                if (u) {
                    user = u;
                    escucharDatos();
                }
            });
        }

        function escucharDatos() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'propuestas');
            onSnapshot(colRef, (snapshot) => {
                let total = 0;
                const nuevasPropuestas = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    total += (data.votos || 0);
                    nuevasPropuestas.push({ id: doc.id, ...data });
                });
                
                todasLasPropuestas = nuevasPropuestas;
                totalVotosGlobal = total;

                // Actualizar contadores globales en tiempo real con "Votaciones"
                document.querySelectorAll('.contador-votos-tiempo-real').forEach(c => {
                    if (c.innerText !== total.toLocaleString()) {
                        c.classList.add('scale-110', 'text-indigo-600');
                        setTimeout(() => c.classList.remove('scale-110', 'text-indigo-600'), 300);
                    }
                    c.innerText = total.toLocaleString();
                });

                if (vistaActual === 'ranking') renderizarRanking();
            });
        }

        // --- NAVEGACIÓN ---
        window.entrarALaArena = () => {
            vistaActual = 'duelo';
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.remove('hidden');
            presentarNuevoDuelo();
        };

        window.navegar = (vista) => {
            vistaActual = vista;
            document.getElementById('seccion-duelo').classList.toggle('hidden', vista !== 'duelo');
            document.getElementById('seccion-ranking').classList.toggle('hidden', vista !== 'ranking');
            
            document.getElementById('nav-duelo').className = vista === 'duelo' ? 'nav-btn text-indigo-600 border-indigo-600' : 'nav-btn text-slate-400 border-transparent';
            document.getElementById('nav-ranking').className = vista === 'ranking' ? 'nav-btn text-indigo-600 border-indigo-600' : 'nav-btn text-slate-400 border-transparent';
            
            if (vista === 'duelo') presentarNuevoDuelo();
            if (vista === 'ranking') renderizarRanking();
        };

        // --- LÓGICA DE LA ARENA ---
        async function procesarConIA(texto) {
            try {
                const prompt = `Analiza: "${texto}". Responde JSON: {"titulo":"4 palabras max","descripcion":"20 palabras max"}`;
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], generationConfig: { responseMimeType: "application/json" } })
                });
                const data = await response.json();
                return JSON.parse(data.candidates[0].content.parts[0].text);
            } catch (e) { return { titulo: "Propuesta", descripcion: texto }; }
        }

        window.enviarPropuesta = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-idea');
            const texto = input.value.trim();
            if (!texto || !user) return;

            const loader = document.getElementById('ia-loader');
            loader.classList.remove('hidden');

            const resumen = await procesarConIA(texto);
            await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'propuestas'), {
                ...resumen,
                original: texto,
                votos: 0,
                creado: serverTimestamp(),
                uid: user.uid
            });
            
            input.value = "";
            loader.classList.add('hidden');
            presentarNuevoDuelo();
        };

        function presentarNuevoDuelo() {
            const container = document.getElementById('contenedor-duelo');
            if (todasLasPropuestas.length < 2) {
                container.innerHTML = `<div class="p-20 text-center text-slate-300 font-bold uppercase tracking-widest text-xs border-2 border-dashed border-slate-200 rounded-[3rem]">Esperando más ciudadanos para iniciar duelos...</div>`;
                return;
            }

            const shuffled = [...todasLasPropuestas].sort(() => 0.5 - Math.random());
            const [p1, p2] = shuffled.slice(0, 2);

            const card = (p, side) => `
                <button onclick="votar('${p.id}')" class="group relative p-12 bg-white border border-slate-100 rounded-[3.5rem] hover:shadow-2xl hover:border-indigo-500 transition-all text-center flex flex-col items-center justify-center min-h-[360px] w-full animate-fade">
                    <span class="absolute top-8 text-[8px] font-black text-slate-200 uppercase tracking-[0.4em]">Opción ${side}</span>
                    <h3 class="text-3xl font-black text-slate-800 uppercase tracking-tighter mb-4 group-hover:opacity-0 transition-opacity duration-300">${p.titulo}</h3>
                    <div class="absolute inset-0 p-10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-all duration-300 bg-indigo-600 rounded-[3.5rem] scale-95 group-hover:scale-100">
                        <p class="text-white text-xl font-medium leading-relaxed">${p.descripcion}</p>
                    </div>
                    <span class="absolute bottom-8 text-[10px] font-black text-indigo-500 uppercase tracking-widest opacity-40 group-hover:opacity-0 transition-opacity">Votar esta idea</span>
                </button>
            `;

            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8 relative">
                    ${card(p1, 'A')}
                    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-10 w-14 h-14 bg-slate-900 text-white items-center justify-center rounded-full font-black text-xs italic border-4 border-[#f4f7fa] shadow-xl">VS</div>
                    ${card(p2, 'B')}
                </div>
            `;
        }

        window.votar = async (id) => {
            if (cargandoDuelo) return;
            cargandoDuelo = true;
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'propuestas', id);
                await updateDoc(docRef, { votos: increment(1) });
                presentarNuevoDuelo();
            } catch (e) {
                console.error("Error al votar:", e);
            } finally {
                cargandoDuelo = false;
            }
        };

        function renderizarRanking() {
            const container = document.getElementById('lista-ranking');
            const sorted = [...todasLasPropuestas].sort((a,b) => (b.votos || 0) - (a.votos || 0)).slice(0, 20);
            
            container.innerHTML = sorted.map((p, i) => {
                const votos = p.votos || 0;
                const porcentaje = totalVotosGlobal > 0 ? ((votos / totalVotosGlobal) * 100).toFixed(1) : "0.0";
                
                return `
                <div class="bg-white p-8 rounded-[2.5rem] mb-6 border border-slate-100 flex flex-col md:flex-row md:items-center justify-between hover:shadow-xl transition-all animate-fade gap-6">
                    <div class="flex items-start gap-6 flex-1">
                        <span class="text-4xl font-black text-slate-100 w-12 text-center mt-1">#${i+1}</span>
                        <div class="flex-1">
                            <h4 class="font-black text-slate-800 uppercase text-2xl md:text-3xl leading-tight tracking-tighter mb-2">${p.titulo}</h4>
                            <p class="text-base text-slate-500 font-medium leading-relaxed mb-4">${p.descripcion}</p>
                            
                            <!-- Barra de aprobación -->
                            <div class="w-full h-3 bg-slate-100 rounded-full overflow-hidden">
                                <div class="h-full bg-indigo-600 rounded-full transition-all duration-1000" style="width: ${porcentaje}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="text-left md:text-right min-w-[120px] bg-slate-50 p-4 md:bg-transparent rounded-2xl">
                        <span class="block text-4xl font-black text-indigo-600 tabular-nums">${porcentaje}%</span>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest">Aprobación Real</span>
                    </div>
                </div>
            `}).join('');
        }

        // --- AL CARGAR ---
        window.onload = () => {
            document.getElementById('frase-dinamica').innerText = frasesHero[Math.floor(Math.random() * frasesHero.length)];
            conectarFirebase();
        };

    </script>

    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3 { font-family: 'Merriweather', serif; }
        .nav-btn { @apply px-6 py-4 font-black text-[10px] uppercase tracking-[0.2em] border-b-4 transition-all; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fade-in 0.4s ease-out forwards; }
    </style>
</head>
<body class="bg-[#f4f7fa] text-slate-900 overflow-x-hidden">

    <!-- LANDING PAGE -->
    <div id="landing-page" class="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-[#fdfcf4] relative">
        <div class="absolute top-10 left-10 font-black italic text-sm tracking-tighter">
            <span class="bg-slate-900 text-white px-2 py-1 rounded mr-1">DD</span> DEMOCRACIADIRECTACL
        </div>

        <div class="max-w-4xl animate-fade">
            <div class="inline-flex items-center gap-3 bg-indigo-50 px-6 py-2 rounded-full text-indigo-600 mb-10 border border-indigo-100 shadow-sm">
                <span class="relative flex h-3 w-3">
                    <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-indigo-400 opacity-75"></span>
                    <span class="relative inline-flex rounded-full h-3 w-3 bg-indigo-500"></span>
                </span>
                <span class="text-[10px] font-black uppercase tracking-widest">
                    <span class="contador-votos-tiempo-real transition-all duration-300">0</span> Votaciones
                </span>
            </div>

            <h1 class="text-6xl md:text-8xl font-bold text-[#001f3f] leading-[0.9] tracking-tighter mb-8">
                El pulso real<br>de <span class="text-indigo-600">Chile</span>.
            </h1>
            
            <p id="frase-dinamica" class="text-2xl text-slate-500 font-medium mb-12 italic leading-relaxed px-4"></p>

            <button onclick="entrarALaArena()" class="group relative px-12 py-6 bg-slate-900 text-white font-black rounded-full overflow-hidden hover:bg-indigo-600 transition-all shadow-2xl hover:scale-105 active:scale-95">
                <span class="relative z-10 uppercase tracking-[0.2em] text-sm">Entrar a La Arena</span>
                <i class="fas fa-bolt ml-3 group-hover:animate-bounce"></i>
            </button>
        </div>

        <footer class="absolute bottom-10 text-slate-300 text-[9px] font-black uppercase tracking-[0.5em]">
            Santiago, Chile • 2026 • Democracia Directa
        </footer>
    </div>

    <!-- APP INTERFACE -->
    <div id="app-interface" class="hidden min-h-screen flex flex-col">
        <nav class="sticky top-0 z-40 bg-white/80 backdrop-blur-md border-b border-slate-100 px-6">
            <div class="max-w-6xl mx-auto flex justify-between items-center h-20">
                <div class="font-black italic text-lg tracking-tighter">
                    DEMOCRACIADIRECTA<span class="text-indigo-600">CL</span>
                </div>
                <div class="flex gap-4">
                    <button id="nav-duelo" onclick="navegar('duelo')" class="nav-btn text-indigo-600 border-indigo-600">La Arena</button>
                    <button id="nav-ranking" onclick="navegar('ranking')" class="nav-btn text-slate-400 border-transparent">Top 20</button>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-6xl mx-auto w-full p-8 py-12">
            <!-- VISTA ARENA -->
            <div id="seccion-duelo" class="animate-fade">
                <div id="contenedor-duelo" class="mb-20 min-h-[380px]"></div>
                
                <div class="max-w-xl mx-auto bg-white p-10 rounded-[3.5rem] shadow-xl border border-slate-50 relative">
                    <h3 class="text-[9px] font-black text-indigo-500 uppercase tracking-[0.4em] mb-6">Proponer Nueva Idea</h3>
                    <form onsubmit="enviarPropuesta(event)">
                        <textarea id="input-idea" rows="2" placeholder="¿Qué debería ser prioridad nacional?" class="w-full p-5 bg-slate-50 rounded-2xl border-none outline-none focus:ring-2 focus:ring-indigo-100 text-xl font-medium resize-none mb-6"></textarea>
                        <div id="ia-loader" class="hidden absolute inset-0 bg-white/90 backdrop-blur-sm rounded-[3rem] flex items-center justify-center z-10">
                            <div class="text-center">
                                <i class="fas fa-microchip text-indigo-600 text-2xl animate-spin mb-3"></i>
                                <p class="text-[9px] font-black uppercase tracking-widest text-indigo-400">Sintetizando idea...</p>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-[10px] uppercase tracking-[0.3em] hover:bg-indigo-600 transition-all shadow-lg">Lanzar a La Arena <i class="fas fa-paper-plane ml-2"></i></button>
                    </form>
                </div>
            </div>

            <!-- VISTA RANKING -->
            <div id="seccion-ranking" class="hidden animate-fade">
                <div class="flex flex-col md:flex-row justify-between items-end mb-12 gap-6">
                    <div>
                        <h2 class="text-5xl font-black italic tracking-tighter">El Podio <span class="text-indigo-600">Ciudadano</span></h2>
                        <p class="text-slate-400 text-[10px] font-black uppercase tracking-widest mt-2">Propuestas con mayor nivel de aprobación</p>
                    </div>
                    <div class="bg-slate-900 text-white p-6 rounded-[2rem] flex items-center gap-4 min-w-[240px] shadow-xl">
                        <i class="fas fa-check-double text-indigo-400 text-xl"></i>
                        <div>
                            <span class="block text-3xl font-black contador-votos-tiempo-real tabular-nums">0</span>
                            <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest">Votaciones</span>
                        </div>
                    </div>
                </div>
                <div id="lista-ranking" class="max-w-5xl"></div>
            </div>
        </main>
    </div>

</body>
</html>

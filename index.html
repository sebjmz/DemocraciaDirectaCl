<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracia Directa CL - Plataforma Ciudadana</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .perspective-1000 { perspective: 1000px; }
        .animate-fade-in { animation: fadeIn 0.8s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* Estilo para el estado de carga inicial */
        #root:empty::before {
            content: "Iniciando Sistema de Soberanía...";
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            color: #94a3b8;
            background: #f8fafc;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-900">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        const { useState, useEffect, useMemo } = React;

        // --- GESTIÓN DE FIREBASE DINÁMICA ---
        let db = null;
        let auth = null;

        async function initFirebase() {
            try {
                // Solo intentamos cargar si la variable de configuración existe y es válida
                if (typeof __firebase_config === 'undefined' || !__firebase_config || __firebase_config.includes("YOUR_")) {
                    console.warn("Firebase no configurado. Iniciando en modo Local (Demo).");
                    return null;
                }

                const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js");
                const { getFirestore } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js");
                const { getAuth, signInAnonymously } = await import("https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js");

                const config = JSON.parse(__firebase_config);
                const app = initializeApp(config);
                db = getFirestore(app);
                auth = getAuth(app);
                
                await signInAnonymously(auth);
                return { db, auth };
            } catch (e) {
                console.error("Error en conexión Firebase:", e);
                return null;
            }
        }

        const Icon = ({ name, size = 20, className = "" }) => {
            useEffect(() => { 
                if (window.lucide) window.lucide.createIcons(); 
            }, [name]);
            return <i data-lucide={name} className={className} style={{ width: size, height: size }}></i>;
        };

        // --- COMPONENTE PRINCIPAL ---
        function App() {
            const [isFirebaseEnabled, setIsFirebaseEnabled] = useState(false);
            const [ready, setReady] = useState(false);
            const [ideas, setIdeas] = useState([
                // Datos iniciales de ejemplo por si no hay conexión
                { id: '1', title: 'TRANSPORTE PÚBLICO GRATUITO', description: 'Implementar tarifa cero en regiones para reducir huella de carbono.', votes: 12, appearances: 20 },
                { id: '2', title: 'SISTEMA ÚNICO DE SALUD', description: 'Unificar prestadores bajo un estándar de calidad digital nacional.', votes: 15, appearances: 20 },
                { id: '3', title: 'DESCENTRALIZACIÓN FISCAL', description: 'Permitir que regiones gestionen el 40% de sus impuestos.', votes: 8, appearances: 15 }
            ]);
            const [currentPair, setCurrentPair] = useState([]);
            const [view, setView] = useState('landing');
            const [isAddingIdea, setIsAddingIdea] = useState(false);
            const [newIdeaText, setNewIdeaText] = useState('');
            const [isGenerating, setIsGenerating] = useState(false);
            const [message, setMessage] = useState(null);

            // 1. Inicializar sistema
            useEffect(() => {
                initFirebase().then(fb => {
                    if (fb) {
                        setIsFirebaseEnabled(true);
                        // Aquí se configurarían los listeners reales de Firestore si fb existe
                        // Por brevedad en esta demo, si no hay FB usamos el estado local
                    }
                    setReady(true);
                    // Seleccionar par inicial
                    const shuffled = [...ideas].sort(() => 0.5 - Math.random());
                    setCurrentPair([shuffled[0], shuffled[1]]);
                });
            }, []);

            const handleVote = async (winnerId) => {
                // Actualización local para que la UI responda inmediatamente
                const updatedIdeas = ideas.map(idea => {
                    if (idea.id === winnerId) {
                        return { ...idea, votes: idea.votes + 1, appearances: idea.appearances + 1 };
                    }
                    if (currentPair.find(p => p.id === idea.id && p.id !== winnerId)) {
                        return { ...idea, appearances: idea.appearances + 1 };
                    }
                    return idea;
                });
                
                setIdeas(updatedIdeas);
                setMessage({ type: 'success', text: 'Voto procesado' });
                setTimeout(() => setMessage(null), 1500);

                // Elegir nuevo par
                const otherIdeas = updatedIdeas.filter(i => !currentPair.find(p => p.id === i.id));
                const nextIdeas = otherIdeas.length >= 2 ? otherIdeas : updatedIdeas;
                const shuffled = [...nextIdeas].sort(() => 0.5 - Math.random());
                setCurrentPair([shuffled[0], shuffled[1]]);

                // Aquí iría el código de updateDoc si isFirebaseEnabled es true
            };

            const handleAddIdea = async (e) => {
                e.preventDefault();
                if (!newIdeaText.trim() || isGenerating) return;
                setIsGenerating(true);
                
                try {
                    // Simulación de IA (Gemini funcionará si hay API Key, si no usa fallback)
                    const mockDesc = "Propuesta analizada por el sistema de neutralidad ciudadana.";
                    
                    const newIdea = {
                        id: Date.now().toString(),
                        title: newIdeaText.toUpperCase(),
                        description: mockDesc,
                        votes: 0,
                        appearances: 0,
                        createdAt: Date.now()
                    };
                    
                    setIdeas(prev => [newIdea, ...prev]);
                    setNewIdeaText('');
                    setIsAddingIdea(false);
                    setMessage({ type: 'success', text: 'Propuesta publicada (Modo Local)' });
                } catch (err) {
                    setMessage({ type: 'error', text: 'Error al procesar' });
                } finally {
                    setIsGenerating(false);
                    setTimeout(() => setMessage(null), 3000);
                }
            };

            const sortedRanking = useMemo(() => {
                return [...ideas].sort((a, b) => {
                    const ratioA = a.appearances > 0 ? a.votes / a.appearances : 0;
                    const ratioB = b.appearances > 0 ? b.votes / b.appearances : 0;
                    return ratioB - ratioA;
                });
            }, [ideas]);

            if (!ready) return null;

            if (view === 'landing') {
                return (
                    <div className="min-h-screen">
                        <nav className="fixed top-0 w-full bg-white/80 backdrop-blur-md z-50 border-b border-slate-200 px-8 py-5 flex justify-between items-center">
                            <div className="flex items-center gap-2">
                                <div className="bg-slate-900 p-1.5 rounded-lg"><Icon name="fingerprint" className="text-cyan-400" /></div>
                                <span className="text-xl font-black uppercase tracking-tighter">Democracia Directa CL</span>
                            </div>
                            <div className="flex items-center gap-4">
                                {!isFirebaseEnabled && <span className="text-[9px] font-bold bg-amber-100 text-amber-600 px-2 py-1 rounded uppercase tracking-widest">Modo Demo</span>}
                                <button onClick={() => setView('vote')} className="px-6 py-2 bg-slate-900 text-white rounded-full font-bold hover:bg-slate-800 transition-all text-sm">Entrar</button>
                            </div>
                        </nav>
                        <header className="pt-48 pb-20 px-6 text-center max-w-4xl mx-auto space-y-10 animate-fade-in">
                            <div className="inline-flex items-center gap-2 px-4 py-2 bg-white border border-slate-200 text-slate-500 rounded-full text-[10px] font-black uppercase tracking-widest shadow-sm">
                                <Icon name="sparkles" size={14} className="text-cyan-500" /> Soberanía Digital
                            </div>
                            <h1 className="text-7xl md:text-8xl font-black tracking-tighter text-slate-900 leading-[0.85]">
                                Ideas <span className="text-cyan-500 italic">puras</span>.<br/>Poder <span className="underline decoration-slate-300 underline-offset-4">real</span>.
                            </h1>
                            <p className="text-xl text-slate-500 font-medium leading-relaxed max-w-2xl mx-auto">
                                La plataforma donde el ciudadano decide prioridades mediante duelos binarios directos.
                            </p>
                            <div className="flex justify-center gap-4">
                                <button onClick={() => setView('vote')} className="px-10 py-5 bg-slate-900 text-white rounded-2xl font-black text-lg hover:bg-cyan-500 transition-all shadow-xl flex items-center gap-2">Votar Ahora <Icon name="chevron-right" /></button>
                                <button onClick={() => setView('ranking')} className="px-10 py-5 bg-white border border-slate-200 text-slate-700 rounded-2xl font-black text-lg hover:border-slate-900 transition-all">Ranking</button>
                            </div>
                        </header>
                    </div>
                );
            }

            return (
                <div className="min-h-screen pb-20">
                    <nav className="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-50 shadow-sm">
                        <div onClick={() => setView('landing')} className="flex items-center gap-2 cursor-pointer">
                            <div className="bg-slate-900 p-1 rounded-md"><Icon name="fingerprint" size={16} className="text-cyan-400" /></div>
                            <h1 className="text-sm font-black uppercase tracking-tighter">Democracia Directa CL</h1>
                        </div>
                        <div className="flex bg-slate-100 p-1 rounded-xl">
                            <button onClick={() => setView('vote')} className={`px-5 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${view === 'vote' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>Duelos</button>
                            <button onClick={() => setView('ranking')} className={`px-5 py-2 rounded-lg text-[10px] font-black uppercase tracking-widest transition-all ${view === 'ranking' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-400'}`}>Consenso</button>
                        </div>
                    </nav>

                    <main className="max-w-4xl mx-auto p-6 md:p-10 animate-fade-in">
                        {message && (
                            <div className="fixed top-24 left-1/2 -translate-x-1/2 z-[100] px-6 py-3 bg-slate-900 text-white rounded-2xl shadow-2xl flex items-center gap-3">
                                <Icon name={message.type === 'success' ? "check-circle" : "alert-circle"} size={18} className="text-cyan-400" />
                                <span className="text-[10px] font-black uppercase tracking-widest">{message.text}</span>
                            </div>
                        )}

                        {view === 'vote' ? (
                            <div className="space-y-12 py-4">
                                <div className="text-center space-y-2">
                                    <h2 className="text-4xl font-black uppercase tracking-tight">Duelo de Prioridades</h2>
                                    <p className="text-slate-400 text-xs font-bold uppercase tracking-[0.2em]">Selecciona la idea más urgente para el país</p>
                                </div>

                                {currentPair.length === 2 ? (
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                        {currentPair.map((idea, idx) => (
                                            <div key={idea.id} className="relative group h-80">
                                                <button
                                                    onClick={() => handleVote(idea.id)}
                                                    className="w-full h-full bg-white border-2 border-slate-200 rounded-[2.5rem] p-10 flex flex-col items-center justify-center text-center shadow-sm hover:shadow-2xl hover:border-cyan-400 transition-all duration-500 overflow-hidden relative"
                                                >
                                                    <span className="text-xl font-black text-slate-900 uppercase tracking-tighter mb-4">
                                                        {idea.title}
                                                    </span>
                                                    <p className="text-xs text-slate-400 font-medium leading-relaxed italic line-clamp-3">{idea.description}</p>
                                                    <div className="absolute inset-0 bg-slate-900 text-white opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center p-10">
                                                        <div className="flex flex-col items-center gap-4">
                                                            <Icon name="check" size={40} className="text-cyan-400" />
                                                            <span className="font-black uppercase tracking-widest text-sm">Votar por esta prioridad</span>
                                                        </div>
                                                    </div>
                                                </button>
                                                {idx === 0 && <div className="hidden md:flex absolute -right-10 top-1/2 -translate-y-1/2 bg-white border-2 border-slate-100 text-slate-300 w-10 h-10 rounded-full items-center justify-center font-black z-10 shadow-sm italic text-xs">VS</div>}
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="text-center py-40 text-slate-300 font-black uppercase tracking-widest text-xs animate-pulse">Generando siguiente par...</div>
                                )}

                                <div className="pt-10 flex justify-center border-t border-slate-200">
                                    <button onClick={() => setIsAddingIdea(true)} className="px-8 py-4 bg-slate-900 text-white rounded-2xl font-black hover:bg-slate-800 transition-all shadow-xl flex items-center gap-2 uppercase tracking-widest text-xs">
                                        <Icon name="plus" size={18} className="text-cyan-400" /> Proponer nueva idea
                                    </button>
                                </div>
                            </div>
                        ) : (
                            <div className="space-y-8 py-4">
                                <div className="space-y-2 border-b border-slate-200 pb-8">
                                    <h2 className="text-5xl font-black tracking-tighter uppercase">Consenso Ciudadano</h2>
                                    <p className="text-slate-400 text-xs font-bold uppercase tracking-widest">Ranking basado en tasa de éxito en duelos</p>
                                </div>
                                <div className="grid gap-4">
                                    {sortedRanking.map((idea, index) => {
                                        const ratio = idea.appearances > 0 ? Math.round((idea.votes / idea.appearances) * 100) : 0;
                                        return (
                                            <div key={idea.id} className="bg-white border border-slate-200 p-8 rounded-[2rem] flex items-center gap-6 shadow-sm hover:shadow-lg transition-all group">
                                                <div className={`w-14 h-14 rounded-xl flex items-center justify-center text-xl font-black ${index < 3 ? 'bg-slate-900 text-cyan-400' : 'bg-slate-50 text-slate-300'}`}>{index + 1}</div>
                                                <div className="flex-grow">
                                                    <h3 className="text-lg font-black uppercase tracking-tight">{idea.title}</h3>
                                                    <p className="text-[10px] text-slate-400 font-medium italic mt-1 line-clamp-1">{idea.description}</p>
                                                </div>
                                                <div className="text-right">
                                                    <div className="text-3xl font-black leading-none">{ratio}%</div>
                                                    <div className="text-[9px] font-black text-slate-400 uppercase tracking-widest">Aceptación</div>
                                                </div>
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </main>

                    {isAddingIdea && (
                        <div className="fixed inset-0 bg-slate-900/90 backdrop-blur-sm z-[200] flex items-center justify-center p-6">
                            <form onSubmit={handleAddIdea} className="bg-white w-full max-w-lg rounded-[2.5rem] overflow-hidden shadow-2xl">
                                <div className="p-10 space-y-8">
                                    <div className="flex justify-between items-start">
                                        <h3 className="text-2xl font-black uppercase tracking-tight">Nueva Propuesta</h3>
                                        <button type="button" onClick={() => setIsAddingIdea(false)} className="text-slate-300 hover:text-slate-900 transition-colors"><Icon name="x" size={24} /></button>
                                    </div>
                                    <input 
                                        autoFocus required
                                        placeholder="Ej: Reforma de Pensiones..."
                                        value={newIdeaText}
                                        onChange={(e) => setNewIdeaText(e.target.value)}
                                        className="w-full p-6 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-cyan-400 focus:outline-none text-xl font-bold"
                                    />
                                    <p className="text-[10px] text-slate-400 font-bold uppercase tracking-wider">La IA redactará una descripción neutral tras el envío.</p>
                                </div>
                                <div className="p-6 bg-slate-50 flex gap-4 border-t border-slate-100">
                                    <button type="button" onClick={() => setIsAddingIdea(false)} className="flex-1 py-4 font-black text-slate-400 uppercase text-[10px] tracking-widest">Cancelar</button>
                                    <button disabled={isGenerating || !newIdeaText.trim()} type="submit" className="flex-[2] py-4 bg-slate-900 text-white font-black rounded-xl hover:bg-cyan-500 transition-all uppercase text-[10px] tracking-widest">
                                        {isGenerating ? 'Procesando...' : 'Publicar'}
                                    </button>
                                </div>
                            </form>
                        </div>
                    )}
                </div>
            );
        }

        window.addEventListener('DOMContentLoaded', () => {
            const root = ReactDOM.createRoot(document.getElementById('root'));
            root.render(<App />);
        });
    </script>
</body>
</html>

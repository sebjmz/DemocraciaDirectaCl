<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACIADIRECTACL | Chile Decide</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Merriweather:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWxTFJGOFesMgIyp5C65qQEnFr5_dCxcU",
            authDomain: "democraciadirectacl-b75ad.firebaseapp.com",
            projectId: "democraciadirectacl-b75ad",
            storageBucket: "democraciadirectacl-b75ad.firebasestorage.app",
            messagingSenderId: "837131448793",
            appId: "1:837131448793:web:2b5d2aef6e925bac8d29c8"
        };

        const appId = 'democraciadirectacl';
        let db, auth, user;
        let todasLasPropuestas = [];
        let vistaActual = 'landing';
        let totalVotosGlobal = 0;

        const titulosImpacto = [
            "CHILE<br><span class='text-orange-500'>DECIDE</span>",
            "PODER<br><span class='text-orange-500'>DIRECTO</span>",
            "LA<br><span class='text-orange-500'>ARENA</span>",
            "TU<br><span class='text-orange-500'>MANDATO</span>"
        ];

        async function conectarFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (u) => {
                    if (u) {
                        user = u;
                        escucharDatos();
                    }
                });
            } catch (e) { 
                actualizarComponentes();
            }
        }

        function escucharDatos() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'propuestas');
            onSnapshot(colRef, (snapshot) => {
                let total = 0;
                let nuevasPropuestas = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    total += (data.votos || 0);
                    nuevasPropuestas.push({ id: doc.id, ...data });
                });
                todasLasPropuestas = nuevasPropuestas;
                totalVotosGlobal = total;
                actualizarComponentes();
            }, (err) => console.error("Error Firestore:", err));
        }

        function actualizarComponentes() {
            document.querySelectorAll('.contador-votos-tiempo-real').forEach(c => {
                c.innerText = (totalVotosGlobal || 0).toLocaleString();
            });
            if (vistaActual === 'ranking') renderizarRanking();
        }

        function inicializarLanding() {
            const index = Math.floor(Math.random() * titulosImpacto.length);
            document.getElementById('main-title').innerHTML = titulosImpacto[index];
        }

        window.entrarALaArena = () => {
            vistaActual = 'duelo';
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.remove('hidden');
            presentarNuevoDuelo();
            window.scrollTo(0, 0);
        };

        window.navegar = (vista) => {
            vistaActual = vista;
            document.getElementById('seccion-duelo').classList.toggle('hidden', vista !== 'duelo');
            document.getElementById('seccion-ranking').classList.toggle('hidden', vista !== 'ranking');
            
            document.getElementById('nav-duelo').className = vista === 'duelo' ? 'nav-btn active-nav' : 'nav-btn inactive-nav';
            document.getElementById('nav-ranking').className = vista === 'ranking' ? 'nav-btn active-nav' : 'nav-btn inactive-nav';
            
            if (vista === 'ranking') renderizarRanking();
            if (vista === 'duelo') presentarNuevoDuelo();
            window.scrollTo(0, 0);
        };

        function presentarNuevoDuelo() {
            const container = document.getElementById('contenedor-duelo');
            if (todasLasPropuestas.length < 2) {
                container.innerHTML = `<div class="p-10 text-center animate-pulse text-indigo-400 font-black italic uppercase tracking-[0.2em] text-xs">Sincronizando Arena...</div>`;
                return;
            }

            const shuffled = [...todasLasPropuestas].sort(() => 0.5 - Math.random());
            const seleccionadas = shuffled.slice(0, 2);

            const card = (p, label, colorBorder) => `
                <button onclick="votar('${p.id}')" class="group relative p-8 md:p-12 bg-[#0a1128] border-b-[6px] ${colorBorder} rounded-[2.5rem] hover:translate-y-[-4px] transition-all text-left flex flex-col min-h-[320px] md:min-h-[400px] w-full animate-fade overflow-hidden shadow-2xl">
                    <div class="flex justify-between items-center mb-10">
                        <span class="text-[10px] font-black text-slate-600 uppercase tracking-[0.3em]">${label}</span>
                        <i class="fas fa-flag text-slate-800 text-2xl group-hover:text-orange-500 transition-colors"></i>
                    </div>
                    <h3 class="text-3xl md:text-5xl font-black text-white tracking-tighter mb-6 leading-none uppercase group-hover:text-orange-400 transition-colors">${p.titulo}</h3>
                    <p class="text-sm md:text-lg text-slate-400 font-medium leading-relaxed flex-grow italic">"${p.descripcion}"</p>
                    <div class="mt-8 pt-6 border-t border-white/5 flex items-center justify-between">
                        <span class="text-[9px] font-black text-slate-700 uppercase tracking-widest italic">Voto Ganador</span>
                        <div class="flex items-center gap-2 text-orange-500 font-black text-[10px] opacity-0 group-hover:opacity-100 transition-all translate-x-4 group-hover:translate-x-0">
                            <span>ELEGIR</span>
                            <i class="fas fa-chevron-right"></i>
                        </div>
                    </div>
                </button>
            `;

            container.innerHTML = `
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 md:gap-12 relative">
                    ${card(seleccionadas[0], 'OPCIÓN A', 'border-indigo-600')}
                    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-20 w-14 h-14 bg-orange-600 text-white items-center justify-center rounded-full font-black italic border-[4px] border-[#050a1e] shadow-2xl text-[10px] tracking-tighter">VS</div>
                    ${card(seleccionadas[1], 'OPCIÓN B', 'border-slate-800')}
                </div>
            `;
        }

        window.votar = async (id) => {
            const container = document.getElementById('contenedor-duelo');
            container.style.opacity = "0.3";
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'propuestas', id);
                await updateDoc(docRef, { votos: increment(1) });
                setTimeout(() => {
                    presentarNuevoDuelo();
                    container.style.opacity = "1";
                }, 150);
            } catch (e) {
                container.style.opacity = "1";
            }
        };

        function renderizarRanking() {
            const container = document.getElementById('lista-ranking');
            const sorted = [...todasLasPropuestas].sort((a,b) => (b.votos || 0) - (a.votos || 0)).slice(0, 20);
            const maxVotos = sorted.length > 0 ? (sorted[0].votos || 0) : 0;

            container.innerHTML = sorted.map((p, i) => {
                const votos = p.votos || 0;
                const barra = maxVotos > 0 ? ((votos / maxVotos) * 100) : 0;

                return `
                <div class="bg-[#0a1128] p-8 rounded-[2rem] mb-4 border-l-[4px] border-orange-500 flex flex-col md:flex-row items-center gap-6 md:gap-10 animate-fade relative overflow-hidden group">
                    <span class="text-5xl font-black text-white/10 w-full md:w-20 text-center md:text-left italic z-0 group-hover:text-orange-500/20 transition-colors">${i+1}</span>
                    <div class="flex-1 w-full z-10">
                        <h4 class="font-black text-white uppercase text-xl md:text-3xl mb-1 tracking-tighter text-center md:text-left leading-none">${p.titulo}</h4>
                        <p class="text-xs md:text-sm text-slate-400 mt-2 mb-4 italic font-medium text-center md:text-left">"${p.descripcion}"</p>
                        <div class="w-full h-1 bg-white/5 rounded-full overflow-hidden mt-4 text-[9px] text-slate-500 uppercase font-black tracking-widest flex justify-between">
                            <span>APOYO POPULAR</span>
                        </div>
                        <div class="w-full h-1.5 bg-white/5 rounded-full overflow-hidden mt-1">
                            <div class="h-full bg-orange-500/50 group-hover:bg-orange-500 transition-all" style="width: ${barra}%"></div>
                        </div>
                    </div>
                    <div class="text-center md:text-right min-w-[160px] z-10 bg-[#050a1e]/40 p-4 rounded-2xl border border-white/5">
                        <span class="block text-2xl font-black text-white">${votos}</span>
                        <span class="text-[9px] font-bold text-orange-500 uppercase tracking-widest italic">VOTOS ARENA</span>
                    </div>
                </div>
            `}).join('');
        }

        window.onload = () => {
            conectarFirebase();
            inicializarLanding();
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #050a1e; color: #ffffff; -webkit-tap-highlight-color: transparent; }
        .hero-title { font-family: 'Merriweather', serif; }
        .nav-btn { @apply px-3 py-5 md:px-10 md:py-6 font-black text-[11px] md:text-[12px] uppercase tracking-[0.2em] md:tracking-[0.3em] transition-all; }
        .active-nav { @apply text-orange-500 border-b-2 border-orange-500; }
        .inactive-nav { @apply text-slate-500 hover:text-white; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fade-in 0.3s ease-out forwards; }
        
        /* Luz de estado "En Vivo" (Estilo vintage/teléfono) */
        @keyframes blink-glow {
            0%, 100% { opacity: 0.3; filter: drop-shadow(0 0 2px #ef4444); }
            50% { opacity: 1; filter: drop-shadow(0 0 8px #ef4444); }
        }
        .status-light {
            width: 8px;
            height: 8px;
            background-color: #ef4444;
            border-radius: 50%;
            display: inline-block;
            animation: blink-glow 1.5s infinite ease-in-out;
        }
    </style>
</head>
<body class="selection:bg-orange-500 selection:text-white overflow-x-hidden">

    <!-- LANDING PAGE -->
    <div id="landing-page" class="min-h-screen flex flex-col items-center justify-center p-4 md:p-6 text-center relative overflow-hidden">
        <div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
            <div class="absolute top-0 left-1/2 -translate-x-1/2 w-[600px] h-[600px] bg-indigo-600/30 blur-[150px] rounded-full"></div>
        </div>

        <div class="max-w-4xl animate-fade relative z-10 w-full flex flex-col items-center">
            <!-- Indicador en vivo: Compacto en movil -->
            <div class="inline-flex items-center gap-3 md:gap-4 bg-white/5 px-4 py-2 md:px-6 md:py-3 rounded-full mb-6 md:mb-10 border border-white/10">
                <div class="flex items-center gap-2 pr-3 border-r border-white/10">
                    <span class="status-light"></span>
                    <span class="text-[8px] md:text-[9px] font-black uppercase tracking-[0.3em] text-red-500 italic">EN VIVO</span>
                </div>
                <span class="text-[8px] md:text-[10px] font-black uppercase tracking-[0.4em] text-slate-500">
                    <span class="contador-votos-tiempo-real text-white">0</span> VOTOS
                </span>
            </div>
            
            <!-- Titulo: Reducido en movil para ganar espacio -->
            <h1 id="main-title" class="text-5xl md:text-9xl font-black leading-[0.85] tracking-tighter mb-8 md:mb-12 hero-title italic"></h1>

            <!-- Pasos: Horizontales y pequeños en movil -->
            <div class="grid grid-cols-3 gap-2 md:gap-8 mb-8 md:mb-16 w-full max-w-3xl mx-auto">
                <div class="flex flex-col items-center p-2">
                    <div class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center bg-white/5 rounded-full mb-2 text-orange-500 border border-white/5">
                        <i class="fas fa-pen-nib text-[10px] md:text-sm"></i>
                    </div>
                    <span class="text-[8px] md:text-[11px] font-black uppercase tracking-widest text-white leading-none text-center">1. PROPÓN</span>
                </div>
                <div class="flex flex-col items-center p-2">
                    <div class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center bg-white/5 rounded-full mb-2 text-orange-500 border border-white/5">
                        <i class="fas fa-bolt text-[10px] md:text-sm"></i>
                    </div>
                    <span class="text-[8px] md:text-[11px] font-black uppercase tracking-widest text-white leading-none text-center">2. DUELA</span>
                </div>
                <div class="flex flex-col items-center p-2">
                    <div class="w-8 h-8 md:w-10 md:h-10 flex items-center justify-center bg-white/5 rounded-full mb-2 text-orange-500 border border-white/5">
                        <i class="fas fa-crown text-[10px] md:text-sm"></i>
                    </div>
                    <span class="text-[8px] md:text-[11px] font-black uppercase tracking-widest text-white leading-none text-center">3. MANDA</span>
                </div>
            </div>

            <!-- Botón: Siempre visible -->
            <button onclick="entrarALaArena()" class="group relative px-10 py-6 md:px-20 md:py-8 bg-orange-600 text-white font-black rounded-full hover:bg-orange-500 transition-all shadow-[0_20px_60px_rgba(249,115,22,0.3)] overflow-hidden">
                <div class="absolute inset-0 bg-white/10 translate-y-full group-hover:translate-y-0 transition-transform"></div>
                <span class="relative uppercase tracking-[0.5em] text-[10px] md:text-xs italic">ENTRAR A LA ARENA</span>
            </button>
        </div>
    </div>

    <!-- APP INTERFACE (Igual que antes) -->
    <div id="app-interface" class="hidden min-h-screen flex flex-col">
        <nav class="sticky top-0 z-50 bg-[#050a1e]/95 backdrop-blur-xl border-b border-white/5">
            <div class="max-w-7xl mx-auto flex flex-col items-center px-4 pt-4">
                <div class="pb-2 font-black text-xl tracking-tighter uppercase italic cursor-pointer group" onclick="location.reload()">
                    CHILE <span class="text-orange-500 group-hover:text-white transition-colors">DECIDE</span>
                </div>
                <div class="flex w-full justify-center gap-6 md:gap-16">
                    <button id="nav-duelo" onclick="navegar('duelo')" class="nav-btn active-nav">ARENA</button>
                    <button id="nav-ranking" onclick="navegar('ranking')" class="nav-btn inactive-nav">RANKING</button>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-16">
            
            <!-- ARENA -->
            <div id="seccion-duelo" class="animate-fade">
                <div class="text-center mb-12 md:mb-20">
                    <h2 class="text-5xl md:text-7xl font-black uppercase tracking-tighter italic mb-4 text-orange-500">LA ARENA</h2>
                    <p class="text-slate-600 text-[11px] font-black uppercase tracking-[0.4em] italic">Vota por el mandato que debe prevalecer.</p>
                </div>

                <div id="contenedor-duelo" class="mb-20 md:mb-32"></div>
                
                <div class="max-w-2xl mx-auto">
                    <div class="bg-[#1e293b] p-8 md:p-12 rounded-[2.5rem] border border-indigo-500/30 relative shadow-2xl">
                        <h3 class="text-xs font-black text-indigo-400 uppercase tracking-[0.4em] italic mb-8">NUEVA PROPUESTA</h3>
                        <input type="text" placeholder="TÍTULO (MÁX 5 PALABRAS)" class="w-full bg-[#050a1e] p-5 rounded-2xl font-black mb-4 uppercase text-white border border-white/5 focus:border-indigo-500 outline-none">
                        <textarea rows="2" placeholder="BREVE DESCRIPCIÓN..." class="w-full bg-[#050a1e] p-5 rounded-2xl font-bold mb-8 text-white border border-white/5 focus:border-indigo-500 outline-none"></textarea>
                        <button class="w-full bg-indigo-600 text-white py-6 rounded-2xl font-black text-xs uppercase tracking-[0.4em] hover:bg-indigo-500 transition-all">
                            PUBLICAR MANDATO
                        </button>
                    </div>
                </div>
            </div>

            <!-- RANKING -->
            <div id="seccion-ranking" class="hidden animate-fade">
                <div class="mb-12 md:mb-20 flex flex-col md:flex-row md:items-end justify-between gap-8">
                    <div class="text-center md:text-left">
                        <h2 class="text-4xl md:text-7xl font-black italic tracking-tighter mb-4 uppercase leading-none">CONSENSO<br><span class="text-orange-500">NACIONAL</span></h2>
                        <p class="text-slate-600 font-black text-[11px] uppercase tracking-[0.4em] italic">Ideas con mayor respaldo en duelos directos.</p>
                    </div>
                    <div class="bg-white/5 px-8 py-6 rounded-3xl border border-white/5 text-center">
                        <span class="text-[10px] text-slate-500 font-black uppercase tracking-widest block mb-2 italic">DUELOS TOTALES</span>
                        <span class="contador-votos-tiempo-real text-4xl font-black text-orange-500 tracking-tighter">0</span>
                    </div>
                </div>
                <div id="lista-ranking" class="max-w-5xl mx-auto pb-40 px-2 md:px-0"></div>
            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACIADIRECTACL | La Arena</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Merriweather:wght@700;900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = JSON.parse(__firebase_config);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'democraciadirectacl';
        const apiKey = ""; 

        let db, auth, user;
        let todasLasPropuestas = [];
        let vistaActual = 'landing';
        let cargandoVoto = false;
        let totalVotosGlobal = 0;
        let dueloActualIds = []; 

        const propuestasSemilla = [
            { id: "seed1", titulo: "TRANSPORTE GRATIS", descripcion: "Pase libre nacional para estudiantes y adultos mayores.", votos: 10 },
            { id: "seed2", titulo: "SALUD DIGITAL", descripcion: "Plataforma única de telemedicina para eliminar esperas.", votos: 8 },
            { id: "seed3", titulo: "ENERGÍA SOLAR", descripcion: "Subsidio total para paneles en viviendas sociales.", votos: 15 }
        ];

        async function conectarFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }

                onAuthStateChanged(auth, (u) => {
                    if (u) {
                        user = u;
                        escucharDatos();
                    }
                });
            } catch (e) { 
                console.error("Error conexión:", e);
                todasLasPropuestas = propuestasSemilla;
            }
        }

        function escucharDatos() {
            if (!user) return;
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'propuestas');
            onSnapshot(colRef, (snapshot) => {
                let total = 0;
                let nuevasPropuestas = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    total += (data.votos || 0);
                    nuevasPropuestas.push({ id: doc.id, ...data });
                });
                
                todasLasPropuestas = nuevasPropuestas.length > 0 ? nuevasPropuestas : propuestasSemilla;
                totalVotosGlobal = total || (nuevasPropuestas.length === 0 ? 33 : total);

                document.querySelectorAll('.contador-votos-tiempo-real').forEach(c => {
                    c.innerText = totalVotosGlobal.toLocaleString();
                });

                if (vistaActual === 'ranking') renderizarRanking();
                if (vistaActual === 'duelo' && dueloActualIds.length === 0) presentarNuevoDuelo();
            }, (error) => console.error("Error Firestore:", error));
        }

        async function procesarConIA(texto) {
            try {
                // Prompt optimizado para evitar "undefined" y ser crudo/directo
                const prompt = `RESUMEN POLÍTICO CRUDO.
                IDEA: "${texto}".
                REGLAS:
                1. Título: 1-3 palabras, MAYÚSCULAS.
                2. Descripción: 1 frase corta, núcleo de la idea. Sin introducciones.
                3. Prohibido: Nombres, insultos, datos personales.
                Respuesta en JSON: {"titulo": "...", "descripcion": "..."}`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: prompt }] }], 
                        generationConfig: { responseMimeType: "application/json" } 
                    })
                });

                const data = await response.json();
                const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (!resultText) throw new Error("No hay respuesta de IA");
                
                const parseado = JSON.parse(resultText);
                return {
                    titulo: parseado.titulo || "IDEA NUEVA",
                    descripcion: parseado.descripcion || "Sin descripción disponible."
                };
            } catch (e) { 
                console.error("Error IA:", e);
                return { titulo: "NUEVA PROPUESTA", descripcion: texto.substring(0, 100) }; 
            }
        }

        window.enviarPropuesta = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-idea');
            const texto = input.value.trim();
            if (!texto || !user) return;

            const loader = document.getElementById('ia-loader');
            loader.classList.remove('hidden');

            const resumen = await procesarConIA(texto);
            
            try {
                await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'propuestas'), {
                    titulo: resumen.titulo.toUpperCase(),
                    descripcion: resumen.descripcion,
                    original: texto,
                    votos: 0,
                    creado: serverTimestamp(),
                    uid: user.uid
                });
                input.value = "";
                dueloActualIds = [];
                presentarNuevoDuelo();
            } catch(e) {
                console.error("Error al guardar:", e);
            } finally {
                loader.classList.add('hidden');
            }
        };

        window.entrarALaArena = () => {
            vistaActual = 'duelo';
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.remove('hidden');
            if (todasLasPropuestas.length > 0) presentarNuevoDuelo();
        };

        window.navegar = (vista) => {
            vistaActual = vista;
            document.getElementById('seccion-duelo').classList.toggle('hidden', vista !== 'duelo');
            document.getElementById('seccion-ranking').classList.toggle('hidden', vista !== 'ranking');
            
            document.getElementById('nav-duelo').className = vista === 'duelo' ? 'nav-btn text-indigo-600 border-indigo-600' : 'nav-btn text-slate-400 border-transparent';
            document.getElementById('nav-ranking').className = vista === 'ranking' ? 'nav-btn text-indigo-600 border-indigo-600' : 'nav-btn text-slate-400 border-transparent';
            
            if (vista === 'ranking') renderizarRanking();
            if (vista === 'duelo') presentarNuevoDuelo();
        };

        function presentarNuevoDuelo() {
            const container = document.getElementById('contenedor-duelo');
            if (todasLasPropuestas.length < 2) {
                container.innerHTML = `<div class="p-10 text-center text-slate-400 font-bold border-2 border-dashed border-slate-200 rounded-3xl">Esperando más ideas...</div>`;
                return;
            }

            const shuffled = [...todasLasPropuestas].sort(() => 0.5 - Math.random());
            const seleccionadas = shuffled.slice(0, 2);
            dueloActualIds = seleccionadas.map(p => p.id);

            const card = (p, side) => `
                <button onclick="votar('${p.id}')" class="group relative p-8 md:p-10 bg-white border-2 border-slate-100 rounded-[2rem] hover:shadow-xl hover:border-indigo-400 transition-all text-left flex flex-col min-h-[300px] w-full animate-fade">
                    <div class="flex justify-between items-center mb-6">
                        <span class="text-[10px] font-black text-indigo-600 bg-indigo-50 px-4 py-1.5 rounded-full uppercase tracking-wider">Propuesta ${side}</span>
                        <div class="h-10 w-10 rounded-full bg-slate-50 flex items-center justify-center group-hover:bg-indigo-600 group-hover:text-white transition-all shadow-sm">
                            <i class="fas fa-check text-sm"></i>
                        </div>
                    </div>
                    
                    <h3 class="text-2xl md:text-3xl font-black text-slate-900 tracking-tight mb-4 leading-tight uppercase font-inter">${p.titulo || 'SIN TITULO'}</h3>
                    <p class="text-base md:text-lg text-slate-500 font-medium leading-relaxed flex-grow font-inter">${p.descripcion || 'Sin descripción.'}</p>
                    
                    <div class="mt-8 pt-6 border-t border-slate-50 flex items-center justify-between">
                        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest">Apoyar</span>
                        <div class="flex items-center gap-2 text-indigo-600 font-black text-xs opacity-0 group-hover:opacity-100 transition-all translate-x-2 group-hover:translate-x-0">
                            <span>VOTAR</span>
                            <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                </button>
            `;

            container.innerHTML = `
                <div class="text-center mb-8 animate-fade">
                    <h2 class="text-sm font-bold text-slate-600 font-inter">¿Cuál es más prioritaria para Chile?</h2>
                </div>
                <div class="grid md:grid-cols-2 gap-6 relative">
                    ${card(seleccionadas[0], 'A')}
                    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-10 w-14 h-14 bg-slate-900 text-white items-center justify-center rounded-full font-black italic border-4 border-[#f4f7fa] shadow-lg">VS</div>
                    ${card(seleccionadas[1], 'B')}
                </div>
            `;
        }

        window.votar = async (id) => {
            if (cargandoVoto) return;
            cargandoVoto = true;
            const container = document.getElementById('contenedor-duelo');
            container.classList.add('opacity-50');

            try {
                if (!id.startsWith('seed')) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'propuestas', id);
                    await updateDoc(docRef, { votos: increment(1) });
                }
                setTimeout(() => {
                    dueloActualIds = []; 
                    presentarNuevoDuelo();
                    container.classList.remove('opacity-50');
                    cargandoVoto = false;
                }, 300);
            } catch (e) {
                container.classList.remove('opacity-50');
                cargandoVoto = false;
            }
        };

        function renderizarRanking() {
            const container = document.getElementById('lista-ranking');
            const sorted = [...todasLasPropuestas].sort((a,b) => (b.votos || 0) - (a.votos || 0)).slice(0, 30);
            
            container.innerHTML = sorted.map((p, i) => {
                const votos = p.votos || 0;
                const porcentaje = totalVotosGlobal > 0 ? ((votos / totalVotosGlobal) * 100).toFixed(1) : "0.0";
                return `
                <div class="bg-white p-6 rounded-3xl mb-4 border border-slate-100 flex flex-col md:flex-row md:items-center justify-between gap-6 shadow-sm animate-fade">
                    <div class="flex items-start gap-6 flex-1">
                        <span class="text-3xl font-black text-slate-100 w-12">#${i+1}</span>
                        <div class="flex-1">
                            <h4 class="font-black text-slate-900 uppercase text-xl mb-1 font-inter">${p.titulo || 'IDEA'}</h4>
                            <p class="text-sm text-slate-500 font-medium mb-4 font-inter">${p.descripcion || '...'}</p>
                            <div class="w-full h-1.5 bg-slate-50 rounded-full overflow-hidden">
                                <div class="h-full bg-indigo-600" style="width: ${porcentaje}%"></div>
                            </div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="block text-2xl font-black text-indigo-600 font-inter">${porcentaje}%</span>
                    </div>
                </div>
            `}).join('');
        }

        window.onload = () => {
            conectarFirebase();
        };
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fa; }
        .hero-title { font-family: 'Merriweather', serif; font-weight: 900; }
        .nav-btn { @apply px-6 py-3 font-black text-[11px] uppercase tracking-widest border-b-4 transition-all; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fade-in 0.4s ease-out forwards; }
    </style>
</head>
<body class="text-slate-900 overflow-x-hidden selection:bg-indigo-100">

    <!-- LANDING PAGE -->
    <div id="landing-page" class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-[#fdfcf4] relative z-50">
        <div class="max-w-4xl animate-fade">
            <div class="inline-flex items-center gap-3 bg-white px-5 py-2.5 rounded-full text-indigo-600 mb-8 shadow-md border border-slate-50">
                <span class="text-[10px] font-black uppercase tracking-widest">
                    <span class="contador-votos-tiempo-real">0</span> Voluntades Conectadas
                </span>
            </div>
            <h1 class="text-5xl md:text-8xl font-black text-[#001f3f] leading-tight mb-8 hero-title">
                Chile decide<br><span class="text-indigo-600">sin filtros</span>.
            </h1>
            <p class="text-lg md:text-2xl text-slate-400 font-medium mb-12 italic max-w-2xl mx-auto">La soberanía no se delega, se ejerce.</p>
            <button onclick="entrarALaArena()" class="px-10 py-5 bg-slate-900 text-white font-black rounded-full hover:bg-indigo-600 transition-all shadow-xl uppercase tracking-widest text-xs">
                Entrar a La Arena <i class="fas fa-bolt ml-2"></i>
            </button>
        </div>
    </div>

    <!-- APP INTERFACE -->
    <div id="app-interface" class="hidden min-h-screen flex flex-col">
        <nav class="sticky top-0 z-40 bg-white/90 backdrop-blur-xl border-b border-slate-200 px-6">
            <div class="max-w-6xl mx-auto flex justify-between items-center h-20">
                <div class="font-black text-xl italic">DEMOCRACIA<span class="text-indigo-600">DIRECTA</span></div>
                <div class="flex gap-4">
                    <button id="nav-duelo" onclick="navegar('duelo')" class="nav-btn text-indigo-600 border-indigo-600">La Arena</button>
                    <button id="nav-ranking" onclick="navegar('ranking')" class="nav-btn text-slate-400 border-transparent">El Podio</button>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-5xl mx-auto w-full p-6 py-12">
            <div id="seccion-duelo">
                <div id="contenedor-duelo" class="mb-16 min-h-[400px]"></div>
                <div class="max-w-2xl mx-auto bg-white p-8 md:p-12 rounded-[2.5rem] shadow-lg relative">
                    <div class="absolute top-0 left-0 w-1.5 h-full bg-indigo-600"></div>
                    <h3 class="text-[10px] font-black text-indigo-600 uppercase tracking-widest mb-6">Tu idea para Chile</h3>
                    <form onsubmit="enviarPropuesta(event)">
                        <textarea id="input-idea" rows="2" placeholder="Ej: Reducir dieta parlamentaria al 50%..." class="w-full p-6 bg-slate-50 rounded-2xl border-none focus:ring-4 focus:ring-indigo-50 text-xl font-medium mb-6 resize-none"></textarea>
                        <div id="ia-loader" class="hidden absolute inset-0 bg-white/95 flex items-center justify-center z-10 rounded-[2.5rem]">
                            <div class="text-center">
                                <i class="fas fa-brain fa-spin text-3xl text-indigo-600 mb-2"></i>
                                <p class="text-[10px] font-black uppercase text-indigo-600">Sintetizando...</p>
                            </div>
                        </div>
                        <button type="submit" class="w-full bg-slate-900 text-white py-5 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-indigo-600 transition-all">Publicar Idea</button>
                    </form>
                </div>
            </div>

            <div id="seccion-ranking" class="hidden">
                <h2 class="text-4xl md:text-6xl font-black italic hero-title mb-12">El Podio <span class="text-indigo-600">Real</span></h2>
                <div id="lista-ranking"></div>
            </div>
        </main>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACIADIRECTACL | El Mandato</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWxTFJGOFesMgIyp5C65qQEnFr5_dCxcU",
            authDomain: "democraciadirectacl-b75ad.firebaseapp.com",
            projectId: "democraciadirectacl-b75ad",
            storageBucket: "democraciadirectacl-b75ad.firebasestorage.app",
            messagingSenderId: "837131448793",
            appId: "1:837131448793:web:2b5d2aef6e925bac8d29c8"
        };

        const appId = 'democraciadirectacl';
        const apiKey = ""; 
        let db, auth, user;
        let todasLasPropuestas = [];
        let vistaActual = 'landing';
        let cargandoVoto = false;
        let totalVotosGlobal = 0;
        let dueloActualIds = []; 

        async function conectarFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        try { await signInWithCustomToken(auth, __initial_auth_token); } 
                        catch (e) { await signInAnonymously(auth); }
                    } else {
                        await signInAnonymously(auth);
                    }
                };

                await initAuth();
                onAuthStateChanged(auth, (u) => { if (u) { user = u; escucharDatos(); } });
            } catch (e) { console.error("Error conexión:", e); }
        }

        function escucharDatos() {
            if (!user) return;
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'propuestas');
            
            onSnapshot(colRef, (snapshot) => {
                let total = 0;
                let nuevasPropuestas = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    total += (data.votos || 0);
                    nuevasPropuestas.push({ id: doc.id, ...data });
                });
                
                todasLasPropuestas = nuevasPropuestas;
                totalVotosGlobal = total;
                actualizarComponentes();
            }, (error) => { console.error("Error Firestore:", error); });
        }

        function actualizarComponentes() {
            document.querySelectorAll('.contador-votos-tiempo-real').forEach(c => {
                c.innerText = totalVotosGlobal.toLocaleString();
            });
            if (vistaActual === 'ranking') renderizarRanking();
            if (vistaActual === 'duelo' && dueloActualIds.length === 0) presentarNuevoDuelo();
        }

        async function procesarPropuestaEnBackground(docId, textoOriginal) {
            const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'propuestas', docId);
            const systemPrompt = `Resumen JSON: {"titulo":"MÁX 3 PALABRAS", "descripcion":"Una frase"}`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: textoOriginal }] }], 
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json" } 
                    })
                });

                const data = await response.json();
                const result = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text);

                await updateDoc(docRef, {
                    titulo: result.titulo.toUpperCase(),
                    descripcion: result.descripcion,
                    estado: 'activo'
                });
            } catch (e) {
                await updateDoc(docRef, {
                    titulo: "MANDATO CIUDADANO",
                    descripcion: textoOriginal.substring(0, 100),
                    estado: 'activo'
                });
            }
        }

        window.enviarPropuesta = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-idea');
            const btn = document.getElementById('btn-enviar');
            const feedback = document.getElementById('form-feedback');
            const texto = input.value.trim();
            
            if (!texto || texto.length < 5 || !user) return;

            btn.disabled = true;
            btn.innerText = "PROCESANDO...";

            try {
                const docRef = await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'propuestas'), {
                    titulo: "ANALIZANDO...",
                    descripcion: texto.substring(0, 80) + "...",
                    votos: 1,
                    estado: "procesando",
                    creado: serverTimestamp(),
                    uid: user.uid
                });
                
                input.value = "";
                feedback.innerText = "¡IDEA LANZADA!";
                feedback.className = "mb-10 text-[10px] font-black text-white bg-indigo-600 p-6 rounded-3xl animate-fade uppercase text-center shadow-lg";
                feedback.classList.remove('hidden');
                
                procesarPropuestaEnBackground(docRef.id, texto);
                setTimeout(() => feedback.classList.add('hidden'), 4000);
            } catch (err) {
                console.error(err);
            } finally {
                btn.disabled = false;
                btn.innerText = "LANZAR A DEBATE";
            }
        };

        function presentarNuevoDuelo() {
            const container = document.getElementById('contenedor-duelo');
            let elegibles = todasLasPropuestas.filter(p => p.estado === 'activo');
            if (elegibles.length < 2) elegibles = todasLasPropuestas;

            if (elegibles.length < 2) {
                container.innerHTML = `<div class="p-20 text-center border-4 border-dashed border-slate-200 rounded-[4rem]">Cargando Arena...</div>`;
                return;
            }

            const seleccionadas = [...elegibles].sort(() => 0.5 - Math.random()).slice(0, 2);
            dueloActualIds = seleccionadas.map(p => p.id);

            const card = (p, label, color) => `
                <button onclick="votar('${p.id}')" class="group p-8 bg-white border-b-[8px] border-slate-200 rounded-[2.5rem] hover:border-orange-500 hover:shadow-2xl transition-all text-left flex flex-col min-h-[350px] w-full animate-fade">
                    <span class="text-[10px] font-black text-white ${color} px-5 py-1.5 rounded-full uppercase mb-8 self-start">${label}</span>
                    <h3 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tighter mb-4 leading-none uppercase">${p.titulo}</h3>
                    <p class="text-lg text-slate-500 font-semibold leading-tight">${p.descripcion}</p>
                </button>`;

            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8 relative">
                    ${card(seleccionadas[0], 'OPCIÓN A', 'bg-indigo-600')}
                    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-20 w-16 h-16 bg-orange-600 text-white items-center justify-center rounded-2xl font-black italic border-8 border-[#f8fafc]">VS</div>
                    ${card(seleccionadas[1], 'OPCIÓN B', 'bg-slate-900')}
                </div>`;
        }

        window.votar = async (id) => {
            if (cargandoVoto) return;
            cargandoVoto = true;
            document.getElementById('contenedor-duelo').style.opacity = "0.4";
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'propuestas', id);
                await updateDoc(docRef, { votos: increment(1) });
                setTimeout(() => {
                    dueloActualIds = []; 
                    presentarNuevoDuelo();
                    document.getElementById('contenedor-duelo').style.opacity = "1";
                    cargandoVoto = false;
                }, 400);
            } catch (e) { cargandoVoto = false; }
        };

        function renderizarRanking() {
            const container = document.getElementById('lista-ranking');
            const ordenadas = [...todasLasPropuestas].sort((a,b) => (b.votos || 0) - (a.votos || 0)).slice(0, 30);

            if (ordenadas.length === 0) {
                container.innerHTML = `<p class="text-center p-20 text-slate-400 font-bold uppercase">Sincronizando Ranking...</p>`;
                return;
            }

            const votosLider = ordenadas[0].votos || 1;

            container.innerHTML = ordenadas.map((p, i) => {
                const votosPropuesta = p.votos || 0;
                const pctBarra = ((votosPropuesta / votosLider) * 100).toFixed(0);
                const pctAprobacion = totalVotosGlobal > 0 ? ((votosPropuesta / totalVotosGlobal) * 100).toFixed(1) : "0.0";
                
                return `
                <div class="mb-12 group animate-fade">
                    <div class="flex flex-col md:flex-row items-center gap-6 mb-4 px-4">
                        <span class="text-4xl md:text-5xl font-black ${i < 3 ? 'text-orange-500' : 'text-slate-200'} italic w-20">#${i+1}</span>
                        <div class="flex-1 w-full text-center md:text-left">
                            <h4 class="font-black text-slate-900 uppercase text-3xl tracking-tighter leading-none">${p.titulo}</h4>
                            <p class="text-slate-400 text-[11px] font-bold uppercase mt-1 tracking-widest leading-none">${p.descripcion}</p>
                        </div>
                        <div class="bg-indigo-600 px-6 py-3 rounded-[1.5rem] min-w-[110px] text-center shadow-xl shadow-indigo-100">
                             <span class="block text-xl font-black text-white leading-none">${pctAprobacion}%</span>
                             <span class="text-[8px] font-black text-indigo-200 uppercase tracking-widest">Aprobación</span>
                        </div>
                    </div>
                    <div class="h-3.5 bg-slate-100 rounded-full overflow-hidden relative mx-4">
                        <div class="absolute inset-y-0 left-0 bg-gradient-to-r transition-all duration-1000 ease-out rounded-full ${i === 0 ? 'from-orange-500 to-orange-300' : 'from-slate-900 to-slate-600'}" 
                             style="width: ${pctBarra}%">
                             <div class="absolute inset-0 bg-white/10 animate-pulse"></div>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        window.entrarALaArena = () => {
            vistaActual = 'duelo';
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.remove('hidden');
            presentarNuevoDuelo();
        };

        window.navegar = (vista) => {
            vistaActual = vista;
            document.getElementById('seccion-duelo').classList.toggle('hidden', vista !== 'duelo');
            document.getElementById('seccion-ranking').classList.toggle('hidden', vista !== 'ranking');
            document.getElementById('nav-duelo').className = vista === 'duelo' ? 'nav-btn active-nav' : 'nav-btn inactive-nav';
            document.getElementById('nav-ranking').className = vista === 'ranking' ? 'nav-btn active-nav' : 'nav-btn inactive-nav';
            if (vista === 'ranking') renderizarRanking();
        };

        window.onload = conectarFirebase;
    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; }
        h1, .hero-title { font-family: 'Merriweather', serif; font-weight: 900; }
        .nav-btn { @apply px-8 py-2 font-black text-[10px] uppercase tracking-[0.2em] transition-all rounded-full border-2; }
        .active-nav { @apply text-white bg-indigo-600 border-indigo-600 shadow-lg shadow-indigo-200; }
        .inactive-nav { @apply text-slate-400 bg-transparent border-transparent hover:text-slate-600; }
        .text-gradient { background: linear-gradient(to right, #4f46e5, #f59e0b); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fade-in 0.4s ease-out forwards; }
    </style>
</head>
<body>

    <div id="landing-page" class="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-white relative overflow-hidden">
        <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-indigo-600 via-orange-500 to-indigo-600"></div>
        <div class="max-w-4xl animate-fade z-10">
            <div class="inline-flex items-center gap-4 bg-slate-900 px-6 py-3 rounded-full text-white mb-12 shadow-xl">
                <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                <span class="text-[9px] font-black uppercase tracking-[0.3em]">
                    Total <span class="contador-votos-tiempo-real text-orange-400">0</span> Votos Ciudadanos
                </span>
            </div>
            <h1 class="text-7xl md:text-9xl font-black text-[#050a1e] leading-[0.8] tracking-tighter mb-12 hero-title italic">Chile<br><span class="text-gradient">Decide</span>.</h1>
            <p class="max-w-lg mx-auto text-slate-400 font-bold uppercase tracking-widest text-xs mb-12 leading-loose px-4">Plataforma de soberanía directa procesada por Inteligencia Artificial.</p>
            <button onclick="entrarALaArena()" class="px-12 py-6 bg-slate-900 text-white font-black rounded-full hover:bg-indigo-600 hover:scale-105 transition-all shadow-2xl uppercase tracking-[0.4em] text-xs">Entrar a la Arena</button>
        </div>
    </div>

    <div id="app-interface" class="hidden min-h-screen flex flex-col">
        <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-lg border-b border-slate-100 px-6 py-4">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="font-black text-lg tracking-tighter italic cursor-pointer" onclick="location.reload()">DEMOCRACIA<span class="text-indigo-600">DIRECTACL</span></div>
                <div class="flex gap-2 bg-slate-100 p-1 rounded-full">
                    <button id="nav-duelo" onclick="navegar('duelo')" class="nav-btn active-nav">Arena</button>
                    <button id="nav-ranking" onclick="navegar('ranking')" class="nav-btn inactive-nav">Top 30</button>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-5xl mx-auto w-full p-6 py-12">
            <!-- SECCIÓN ARENA -->
            <div id="seccion-duelo" class="animate-fade">
                <div class="text-center mb-12">
                    <h2 class="text-4xl font-black tracking-tighter uppercase italic">El Duelo de <span class="text-indigo-600">Ideas</span></h2>
                    <p class="text-slate-400 font-bold uppercase tracking-[0.2em] text-[9px] mt-2">Vota por la propuesta que Chile necesita hoy</p>
                </div>
                <div id="contenedor-duelo" class="mb-24"></div>
                
                <div class="max-w-2xl mx-auto">
                    <div class="bg-white p-12 rounded-[3.5rem] shadow-xl border-t-[12px] border-orange-500 relative">
                        <h3 class="text-[9px] font-black text-slate-400 uppercase tracking-[0.4em] mb-8 text-center">Crear Nuevo Mandato</h3>
                        <form onsubmit="enviarPropuesta(event)">
                            <textarea id="input-idea" rows="2" placeholder="Escribe aquí tu visión..." class="w-full p-8 bg-slate-50 rounded-[2rem] text-xl font-black mb-6 focus:outline-none focus:ring-4 focus:ring-indigo-100 transition-all border-none resize-none"></textarea>
                            <p id="form-feedback" class="hidden"></p>
                            <button id="btn-enviar" type="submit" class="w-full bg-slate-900 text-white py-8 rounded-[2rem] font-black uppercase tracking-[0.4em] hover:bg-indigo-600 transition-all shadow-xl">Lanzar Idea</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN RANKING -->
            <div id="seccion-ranking" class="hidden animate-fade">
                <div class="text-center mb-16">
                    <h2 class="text-5xl md:text-7xl font-black italic tracking-tighter leading-none mb-4">Top 30 <span class="text-indigo-600">Nacional</span></h2>
                    <div class="inline-block px-5 py-2 bg-slate-900 text-white rounded-full">
                         <span class="text-[8px] font-black uppercase tracking-[0.3em] italic">La voluntad soberana del pueblo</span>
                    </div>
                </div>
                <div id="lista-ranking" class="pb-32 max-w-4xl mx-auto"></div>
            </div>
        </main>
    </div>
</body>
</html>

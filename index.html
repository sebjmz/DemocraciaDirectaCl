<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracia Directa Chile</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .gradient-btn { background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%); }
    </style>
</head>
<body class="text-slate-900">
    <div id="app" class="min-h-screen flex flex-col">
        <!-- Navegación -->
        <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
            <div class="flex items-center gap-2 cursor-pointer" onclick="location.reload()">
                <div class="bg-indigo-600 p-2 rounded-lg text-white">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"></path></svg>
                </div>
                <span class="font-extrabold text-xl tracking-tighter uppercase">Democracia<span class="text-indigo-600">Directa</span></span>
            </div>
            <button onclick="showRanking()" class="text-[10px] font-black uppercase tracking-widest text-slate-400">Ver Ranking</button>
        </nav>

        <!-- Main -->
        <main class="flex-grow container mx-auto max-w-4xl p-6 flex flex-col items-center justify-center text-center">
            
            <div id="view-home" class="space-y-8">
                <h1 class="text-5xl md:text-7xl font-black tracking-tighter leading-none">Chile decide <br><span class="text-indigo-600">sin filtros.</span></h1>
                <p class="text-slate-500 text-lg max-w-md mx-auto">Vota por las prioridades nacionales de forma directa.</p>
                <button onclick="showVote()" class="gradient-btn text-white px-10 py-5 rounded-2xl font-black text-xl shadow-xl hover:scale-105 transition-all">
                    COMENZAR A VOTAR
                </button>
            </div>

            <div id="view-vote" class="hidden w-full space-y-8">
                <h2 class="text-xl font-bold text-slate-400 uppercase tracking-widest">¿Qué es más urgente?</h2>
                <div id="pair-container" class="grid md:grid-cols-2 gap-4"></div>
            </div>

            <div id="view-ranking" class="hidden w-full space-y-6 text-left">
                <h2 class="text-3xl font-black mb-6">Ranking Actual</h2>
                <div id="ranking-list" class="space-y-3"></div>
                <button onclick="showVote()" class="w-full py-4 text-indigo-600 font-bold border-2 border-indigo-50 rounded-xl mt-4">SEGUIR VOTANDO</button>
            </div>

        </main>

        <footer class="py-8 text-center text-[10px] font-bold text-slate-300 tracking-[0.5em]">
            DEMOCRACIA DIRECTA v1.0
        </footer>
    </div>

    <script>
        const proposals = [
            { id: 1, title: "Seguridad Ciudadana", desc: "Control fronterizo y vigilancia inteligente.", votes: 0, shows: 0 },
            { id: 2, title: "Salud Pública", desc: "Reducción de listas de espera.", votes: 0, shows: 0 },
            { id: 3, title: "Educación de Calidad", desc: "Apoyo directo a estudiantes.", votes: 0, shows: 0 },
            { id: 4, title: "Pensiones Dignas", desc: "Propiedad de los ahorros.", votes: 0, shows: 0 }
        ];

        function showVote() {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-ranking').classList.add('hidden');
            document.getElementById('view-vote').classList.remove('hidden');
            renderPair();
        }

        function showRanking() {
            document.getElementById('view-home').classList.add('hidden');
            document.getElementById('view-vote').classList.add('hidden');
            document.getElementById('view-ranking').classList.remove('hidden');
            renderRanking();
        }

        function renderPair() {
            const shuffled = [...proposals].sort(() => 0.5 - Math.random()).slice(0, 2);
            document.getElementById('pair-container').innerHTML = shuffled.map(p => `
                <button onclick="vote(${p.id}, [${shuffled.map(x=>x.id)}])" class="bg-white p-8 rounded-3xl border-2 border-slate-100 hover:border-indigo-600 shadow-sm text-left transition-all">
                    <div class="text-2xl font-black mb-1">${p.title}</div>
                    <p class="text-slate-500 text-sm">${p.desc}</p>
                </button>
            `).join('');
        }

        function vote(winnerId, pairIds) {
            proposals.forEach(p => {
                if (p.id === winnerId) p.votes++;
                if (pairIds.includes(p.id)) p.shows++;
            });
            renderPair();
            if (proposals.reduce((a,b) => a+b.votes, 0) % 4 === 0) showRanking();
        }

        function renderRanking() {
            const sorted = [...proposals].sort((a,b) => (b.votes/(b.shows||1)) - (a.votes/(a.shows||1)));
            document.getElementById('ranking-list').innerHTML = sorted.map((p, i) => {
                const perc = p.shows > 0 ? ((p.votes/p.shows)*100).toFixed(1) : 0;
                return `
                    <div class="bg-white p-5 rounded-2xl border border-slate-100 shadow-sm">
                        <div class="flex justify-between items-center mb-2 font-bold text-sm">
                            <span>#${i+1} ${p.title}</span>
                            <span class="text-indigo-600">${perc}%</span>
                        </div>
                        <div class="w-full h-2 bg-slate-50 rounded-full overflow-hidden">
                            <div class="h-full gradient-btn" style="width: ${perc}%"></div>
                        </div>
                    </div>
                `;
            }).join('');
        }
    </script>
</body>
</html>

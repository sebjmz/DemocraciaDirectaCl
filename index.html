<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACIADIRECTACL | Sin Intermediarios</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWxTFJGOFesMgIyp5C65qQEnFr5_dCxcU",
            authDomain: "democraciadirectacl-b75ad.firebaseapp.com",
            projectId: "democraciadirectacl-b75ad",
            storageBucket: "democraciadirectacl-b75ad.firebasestorage.app",
            messagingSenderId: "837131448793",
            appId: "1:837131448793:web:2b5d2aef6e925bac8d29c8"
        };

        const appId = 'democraciadirectacl';
        const apiKey = ""; 
        let db, auth, user;
        let todasLasPropuestas = [];
        let vistaActual = 'landing';
        let cargandoVoto = false;
        let totalVotosGlobal = 0;
        let dueloActualIds = []; 

        const opcionesHero = [
            { t: "CHILE DECIDE.", s: "Sin filtros. Sin políticos. Sin esperas." },
            { t: "EL PODER ES TUYO.", s: "Recupera el mando de tu país hoy mismo." },
            { t: "TU VOZ ES LEY.", s: "La IA ejecuta lo que la base ordena." },
            { t: "FUERA FILTROS.", s: "Democracia cruda, directa y real." },
            { t: "SIN INTERMEDIARIOS.", s: "Del ciudadano al código, sin escalas." },
            { t: "MANDATO DIRECTO.", s: "Porque nadie puede decidir mejor que tú." }
        ];

        const propuestasSemilla = [
            { id: "seed1", titulo: "FIN AL CAE", descripcion: "Condonación total e inmediata de la deuda educativa.", votos: 142 },
            { id: "seed2", titulo: "CÁRCEL EFECTIVA", descripcion: "No más beneficios para delitos violentos y corrupción.", votos: 98 },
            { id: "seed3", titulo: "AGUA CIUDADANA", descripcion: "Nacionalización total de los derechos de agua.", votos: 215 }
        ];

        async function conectarFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (u) => {
                    if (u) {
                        user = u;
                        escucharDatos();
                    }
                });
            } catch (e) { 
                todasLasPropuestas = propuestasSemilla;
                actualizarComponentes();
            }
        }

        function escucharDatos() {
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'propuestas');
            onSnapshot(colRef, (snapshot) => {
                let total = 0;
                let nuevasPropuestas = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    total += (data.votos || 0);
                    nuevasPropuestas.push({ id: doc.id, ...data });
                });
                
                todasLasPropuestas = nuevasPropuestas.length > 0 ? nuevasPropuestas : propuestasSemilla;
                totalVotosGlobal = total || (nuevasPropuestas.length === 0 ? 455 : total);
                actualizarComponentes();
            }, (error) => {
                todasLasPropuestas = propuestasSemilla;
                actualizarComponentes();
            });
        }

        function actualizarComponentes() {
            document.querySelectorAll('.contador-votos-tiempo-real').forEach(c => {
                c.innerText = totalVotosGlobal.toLocaleString();
            });
            if (vistaActual === 'ranking') renderizarRanking();
            if (vistaActual === 'duelo' && dueloActualIds.length === 0) presentarNuevoDuelo();
        }

        window.entrarALaArena = () => {
            vistaActual = 'duelo';
            document.getElementById('landing-page').classList.add('hidden');
            document.getElementById('app-interface').classList.remove('hidden');
            presentarNuevoDuelo();
            window.scrollTo(0, 0);
        };

        window.navegar = (vista) => {
            vistaActual = vista;
            document.getElementById('seccion-duelo').classList.toggle('hidden', vista !== 'duelo');
            document.getElementById('seccion-ranking').classList.toggle('hidden', vista !== 'ranking');
            
            const btnDuelo = document.getElementById('nav-duelo');
            const btnRanking = document.getElementById('nav-ranking');
            
            if (vista === 'duelo') {
                btnDuelo.className = 'nav-btn active-nav rounded-xl';
                btnRanking.className = 'nav-btn inactive-nav rounded-xl';
                document.body.style.backgroundColor = "#f8fafc";
            } else {
                btnDuelo.className = 'nav-btn inactive-nav rounded-xl';
                btnRanking.className = 'nav-btn active-nav rounded-xl';
                document.body.style.backgroundColor = "#ffffff";
            }
            
            if (vista === 'ranking') renderizarRanking();
            if (vista === 'duelo' && dueloActualIds.length === 0) presentarNuevoDuelo();
            window.scrollTo(0, 0);
        };

        async function procesarConIA(texto) {
            try {
                const systemPrompt = `Eres un sintetizador de voluntad popular crudo.
                TU OBJETIVO: 
                1. Genera un TITULO de MAXIMO 3 palabras en MAYÚSCULAS.
                2. Genera una DESCRIPCIÓN de una sola frase corta.
                FORMATO JSON: {"titulo":"EJEMPLO", "descripcion":"Ejemplo."}`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        contents: [{ parts: [{ text: texto }] }], 
                        systemInstruction: { parts: [{ text: systemPrompt }] },
                        generationConfig: { responseMimeType: "application/json", temperature: 0.2 } 
                    })
                });
                const data = await response.json();
                return JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || "{}");
            } catch (e) { 
                return { titulo: "NUEVA PROPUESTA", descripcion: texto.substring(0, 60) }; 
            }
        }

        window.enviarPropuesta = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-idea');
            const btn = document.getElementById('btn-publicar');
            const timerDiv = document.getElementById('timer-ui');
            const secsSpan = document.getElementById('timer-secs');
            const texto = input.value.trim();
            
            if (!texto || !user || btn.disabled) return;

            btn.disabled = true;
            input.disabled = true;
            
            let timeLeft = 10;
            timerDiv.classList.remove('hidden');
            secsSpan.innerText = timeLeft;

            const tareaIA = procesarConIA(texto);
            const interval = setInterval(() => {
                timeLeft--;
                if (secsSpan) secsSpan.innerText = timeLeft;
                if (timeLeft <= 0) clearInterval(interval);
            }, 1000);

            setTimeout(async () => {
                const resumen = await tareaIA;
                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'propuestas'), {
                        ...resumen,
                        votos: 1,
                        creado: serverTimestamp(),
                        uid: user.uid
                    });
                    input.value = "";
                    input.disabled = false;
                    btn.disabled = false;
                    timerDiv.classList.add('hidden');
                    window.navegar('ranking');
                } catch (err) {
                    btn.disabled = false;
                    input.disabled = false;
                    timerDiv.classList.add('hidden');
                }
            }, 10000);
        };

        function presentarNuevoDuelo() {
            const container = document.getElementById('contenedor-duelo');
            if (todasLasPropuestas.length < 2) {
                container.innerHTML = `<div class="p-20 text-center animate-pulse text-slate-400 font-bold uppercase tracking-widest">Sincronizando voluntades...</div>`;
                return;
            }

            const shuffled = [...todasLasPropuestas].sort(() => 0.5 - Math.random());
            const seleccionadas = shuffled.slice(0, 2);
            dueloActualIds = seleccionadas.map(p => p.id);

            const card = (p, label, colorClass) => `
                <button onclick="votar('${p.id}')" class="group relative p-8 md:p-12 bg-white border-2 border-transparent hover:border-indigo-600 rounded-[2.5rem] shadow-sm hover:shadow-2xl transition-all duration-500 text-left flex flex-col min-h-[400px] w-full animate-fade overflow-hidden">
                    <div class="flex justify-between items-center mb-8">
                        <span class="text-[10px] font-black text-white ${colorClass} px-5 py-2 rounded-full uppercase tracking-[0.2em]">${label}</span>
                        <div class="w-12 h-12 rounded-2xl bg-slate-50 flex items-center justify-center group-hover:bg-indigo-600 transition-colors duration-500">
                            <i class="fas fa-check text-slate-200 group-hover:text-white transition-colors"></i>
                        </div>
                    </div>
                    <h3 class="text-3xl md:text-4xl font-black text-slate-900 tracking-tight mb-6 leading-tight uppercase group-hover:text-indigo-600 transition-colors">${p.titulo}</h3>
                    <p class="text-lg md:text-xl text-slate-500 font-medium leading-relaxed flex-grow opacity-80 group-hover:opacity-100 transition-opacity">${p.descripcion}</p>
                    <div class="mt-8 pt-6 border-t border-slate-50 flex items-center justify-between">
                        <span class="text-[10px] font-black text-slate-300 uppercase tracking-widest group-hover:text-indigo-400 transition-colors">Click para elegir esta opción</span>
                        <i class="fas fa-arrow-right text-slate-100 group-hover:text-indigo-600 group-hover:translate-x-2 transition-all"></i>
                    </div>
                </button>
            `;

            container.innerHTML = `
                <div class="text-center mb-12">
                    <span class="inline-block px-4 py-1.5 bg-orange-100 text-orange-600 rounded-full text-[10px] font-black uppercase tracking-widest mb-4">Misión obligatoria</span>
                    <h2 class="text-4xl md:text-5xl font-black text-slate-900 tracking-tighter uppercase hero-title">SOLO UNA PUEDE GANAR</h2>
                    <p class="text-slate-400 font-bold uppercase tracking-widest text-xs mt-3 italic">Elige la propuesta que consideres más urgente para Chile</p>
                </div>
                <div class="grid md:grid-cols-2 gap-8 relative max-w-6xl mx-auto items-stretch">
                    ${card(seleccionadas[0], 'OPCIÓN A', 'bg-indigo-600')}
                    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-20 w-16 h-16 bg-slate-900 text-white items-center justify-center rounded-2xl font-black border-8 border-[#f8fafc] shadow-xl text-lg rotate-3 italic">VS</div>
                    ${card(seleccionadas[1], 'OPCIÓN B', 'bg-slate-800')}
                </div>
            `;
        }

        window.votar = async (id) => {
            if (cargandoVoto) return;
            cargandoVoto = true;
            
            // Efecto visual de selección inmediata
            const buttons = document.querySelectorAll('#contenedor-duelo button');
            buttons.forEach(b => {
                b.style.pointerEvents = "none";
                if (!b.getAttribute('onclick').includes(id)) {
                    b.style.opacity = "0.2";
                    b.style.transform = "scale(0.95)";
                } else {
                    b.classList.add('border-indigo-600', 'shadow-2xl');
                }
            });

            try {
                if (!id.startsWith('seed')) {
                    const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'propuestas', id);
                    await updateDoc(docRef, { votos: increment(1) });
                }
                setTimeout(() => {
                    dueloActualIds = []; 
                    presentarNuevoDuelo();
                    cargandoVoto = false;
                }, 400);
            } catch (e) {
                presentarNuevoDuelo();
                cargandoVoto = false;
            }
        };

        function renderizarRanking() {
            const container = document.getElementById('lista-ranking');
            const sorted = [...todasLasPropuestas].sort((a,b) => (b.votos || 0) - (a.votos || 0)).slice(0, 30);
            const maxVotosLider = sorted.length > 0 ? (sorted[0].votos || 0) : 0;

            container.innerHTML = sorted.map((p, i) => {
                const votosPropuesta = p.votos || 0;
                const apoyoGlobalPct = totalVotosGlobal > 0 ? ((votosPropuesta / totalVotosGlobal) * 100).toFixed(1) : "0.0";
                const barraIntensidadPct = maxVotosLider > 0 ? ((votosPropuesta / maxVotosLider) * 100) : 0;

                return `
                <div class="bg-white p-6 md:p-8 rounded-[2rem] mb-6 border border-slate-100 flex flex-col md:flex-row items-center gap-8 shadow-sm animate-fade hover:shadow-md transition-shadow">
                    <span class="text-5xl font-black text-slate-100 w-24 text-center">#${i+1}</span>
                    <div class="flex-1 w-full">
                        <h4 class="font-black text-slate-800 uppercase text-2xl mb-2 tracking-tight">${p.titulo}</h4>
                        <p class="text-slate-500 font-medium text-base mb-5 leading-relaxed">${p.descripcion}</p>
                        <div class="w-full h-3 bg-slate-50 rounded-full overflow-hidden">
                            <div class="h-full bg-indigo-600 rounded-full transition-all duration-1000 shadow-[0_0_15px_rgba(79,70,229,0.3)]" style="width: ${barraIntensidadPct}%"></div>
                        </div>
                    </div>
                    <div class="text-center md:text-right bg-slate-50 px-10 py-6 rounded-3xl min-w-[160px] border border-slate-100">
                        <span class="block text-4xl font-black text-indigo-600">${apoyoGlobalPct}%</span>
                        <span class="text-[10px] font-black text-slate-400 uppercase tracking-widest block italic mt-1">APOYO CIUDADANO</span>
                    </div>
                </div>
            `}).join('');
        }

        window.onload = () => {
            const index = Math.floor(Math.random() * opcionesHero.length);
            const eleccion = opcionesHero[index];
            document.getElementById('hero-title').innerText = eleccion.t;
            document.getElementById('hero-slogan').innerText = eleccion.s;
            conectarFirebase();
        };

    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .hero-title { font-family: 'Merriweather', serif; font-weight: 900; }
        .nav-btn { @apply px-8 py-3 font-black text-[11px] uppercase tracking-widest transition-all duration-300; }
        .active-nav { @apply text-indigo-600 bg-indigo-50/50; }
        .inactive-nav { @apply text-slate-400 hover:text-slate-600; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .timer-progress { border: 4px solid #f1f5f9; border-top: 4px solid #f97316; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="selection:bg-indigo-100 selection:text-indigo-900 overflow-x-hidden">

    <!-- LANDING PAGE -->
    <div id="landing-page" class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-white">
        <div class="max-w-4xl mx-auto flex flex-col items-center">
            <h1 id="hero-title" class="text-5xl sm:text-7xl md:text-8xl font-black text-slate-900 tracking-tighter mb-6 hero-title animate-fade leading-tight uppercase">
                CHILE DECIDE.
            </h1>
            <p id="hero-slogan" class="text-lg md:text-2xl font-bold text-slate-400 uppercase tracking-[0.2em] mb-12 animate-fade italic">
                Sin intermediarios. Sin filtros.
            </p>
            <button onclick="entrarALaArena()" class="group px-12 py-6 bg-slate-900 text-white font-black rounded-2xl hover:bg-indigo-600 transition-all uppercase tracking-widest text-sm shadow-xl hover:scale-105 active:scale-95">
                COMENZAR AHORA <i class="fas fa-arrow-right ml-4 group-hover:translate-x-2 transition-transform text-orange-400"></i>
            </button>
        </div>
    </div>

    <!-- APP INTERFACE -->
    <div id="app-interface" class="hidden min-h-screen flex flex-col">
        <nav class="sticky top-0 z-50 bg-white/80 backdrop-blur-xl border-b border-slate-100 px-6 py-4">
            <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-6">
                <div class="flex items-center gap-4">
                    <div class="font-black text-xl tracking-tight uppercase italic text-slate-900">DEMOCRACIA<span class="text-indigo-600">DIRECTA</span></div>
                    <div class="hidden md:flex bg-slate-50 px-4 py-2 rounded-xl items-center gap-3 border border-slate-100">
                        <div class="w-2 h-2 rounded-full bg-indigo-500 animate-pulse"></div>
                        <span class="text-[10px] font-black text-slate-500 uppercase tracking-widest"><span class="contador-votos-tiempo-real text-indigo-600">0</span> VOTOS</span>
                    </div>
                </div>
                <div class="flex bg-slate-50 p-1.5 rounded-2xl gap-1 border border-slate-100">
                    <button id="nav-duelo" onclick="navegar('duelo')" class="nav-btn active-nav rounded-xl">LA ARENA</button>
                    <button id="nav-ranking" onclick="navegar('ranking')" class="nav-btn inactive-nav rounded-xl">EL PODIO</button>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-7xl mx-auto w-full p-6 py-12 md:py-20">
            <div id="seccion-duelo" class="animate-fade">
                <div id="contenedor-duelo" class="mb-24 min-h-[500px]"></div>
                
                <div class="max-w-3xl mx-auto">
                    <div class="bg-white p-8 md:p-12 rounded-[3rem] shadow-sm border border-slate-100 relative overflow-hidden">
                        <form onsubmit="enviarPropuesta(event)">
                            <h3 class="text-center font-black uppercase tracking-widest text-[9px] text-slate-300 mb-8 italic">PROPONER NUEVA VOLUNTAD</h3>
                            <textarea id="input-idea" rows="2" placeholder="ESCRIBE TU IDEA AQUÍ..." class="w-full p-6 bg-slate-50 rounded-2xl border-none text-xl font-bold mb-8 resize-none focus:ring-2 focus:ring-indigo-100 transition-all placeholder:text-slate-200 uppercase"></textarea>
                            
                            <div id="timer-ui" class="hidden mb-8 text-center animate-fade">
                                <div class="flex items-center justify-center gap-6 bg-slate-900 p-6 rounded-2xl text-white">
                                    <div class="timer-progress"></div>
                                    <div class="text-left">
                                        <span class="text-sm font-black uppercase tracking-widest">SINTETIZANDO MANDATO</span>
                                        <p class="text-[10px] font-bold text-slate-400 italic">ESPERA <span id="timer-secs">10</span>s...</p>
                                    </div>
                                </div>
                            </div>

                            <button id="btn-publicar" type="submit" class="group w-full bg-slate-900 text-white py-6 rounded-2xl font-black text-sm uppercase tracking-widest hover:bg-indigo-600 transition-all shadow-lg active:scale-95 disabled:opacity-50">
                                PUBLICAR MANDATO <i class="fas fa-paper-plane ml-3 text-orange-400"></i>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div id="seccion-ranking" class="hidden animate-fade">
                <div class="max-w-4xl mx-auto mb-16 text-center">
                    <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tight text-slate-900">EL PODIO CIUDADANO</h2>
                    <p class="text-indigo-600 font-bold tracking-widest uppercase text-xs mt-3 italic opacity-70">Las voluntades con mayor peso en el código nacional</p>
                </div>
                <div id="lista-ranking" class="max-w-5xl mx-auto pb-24"></div>
            </div>
        </main>
    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACIADIRECTACL | Soberanía Digital</title>

    <!-- Tailwind CSS para el diseño -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React y Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Firebase SDK Compat -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #020617; 
            color: #f1f5f9;
            margin: 0;
            overflow-x: hidden;
        }

        .gradient-bg {
            background: radial-gradient(circle at 50% -20%, #1e1b4b 0%, #020617 80%);
        }

        .glass {
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 2rem;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass:hover {
            border-color: rgba(99, 102, 241, 0.4);
            transform: translateY(-4px);
        }

        .accent-gradient {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
        }

        .animate-fade-in {
            animation: fadeIn 0.8s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .vote-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .vote-card:active {
            transform: scale(0.95);
        }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo } = React;

        // Variables de entorno proporcionadas por el sistema
        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : { apiKey: "" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'democraciadirectacl-default';

        function App() {
            const [view, setView] = useState('home');
            const [proposals, setProposals] = useState([]);
            const [currentPair, setCurrentPair] = useState([]);
            const [loading, setLoading] = useState(true);
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [newIdea, setNewIdea] = useState("");
            const [ideaTitle, setIdeaTitle] = useState("");
            const [user, setUser] = useState(null);
            const [db, setDb] = useState(null);

            // 1. Inicializar Firebase y Auth
            useEffect(() => {
                const init = async () => {
                    try {
                        if (!firebase.apps.length) {
                            firebase.initializeApp(firebaseConfig);
                        }
                        const auth = firebase.auth();
                        const firestore = firebase.firestore();
                        setDb(firestore);

                        // Autenticación obligatoria antes de cualquier operación
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                            await auth.signInWithCustomToken(__initial_auth_token);
                        } else {
                            await auth.signInAnonymously();
                        }

                        auth.onAuthStateChanged((u) => {
                            if (u) setUser(u);
                        });
                    } catch (err) {
                        console.error("Error en inicialización:", err);
                        setLoading(false);
                    }
                };
                init();
            }, []);

            // 2. Carga de datos con ruta de seguridad estricta
            useEffect(() => {
                if (!user || !db) return;

                // REGLA: Ruta obligatoria para evitar errores de permisos
                const proposalsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('proposals');

                const unsubscribe = proposalsRef.onSnapshot((snapshot) => {
                    const data = snapshot.docs.map(doc => ({
                        id: doc.id,
                        ...doc.data()
                    }));
                    setProposals(data);
                    setLoading(false);
                }, (err) => {
                    console.error("Error Firestore Snapshot:", err);
                    setLoading(false);
                });

                return () => unsubscribe();
            }, [user, db]);

            // Lógica de duelos de votación
            useEffect(() => {
                if (view === 'vote' && currentPair.length === 0 && proposals.length >= 2) {
                    const shuffled = [...proposals].sort(() => 0.5 - Math.random());
                    setCurrentPair(shuffled.slice(0, 2));
                }
            }, [view, currentPair, proposals]);

            const handleVote = async (winnerId) => {
                if (!user || !db) return;
                const proposalsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('proposals');
                
                const loserId = currentPair.find(p => p.id !== winnerId)?.id;
                const batch = db.batch();

                batch.update(proposalsRef.doc(winnerId), {
                    votes: firebase.firestore.FieldValue.increment(1),
                    showCount: firebase.firestore.FieldValue.increment(1)
                });

                if (loserId) {
                    batch.update(proposalsRef.doc(loserId), {
                        showCount: firebase.firestore.FieldValue.increment(1)
                    });
                }

                try {
                    await batch.commit();
                    setCurrentPair([]);
                } catch (e) {
                    console.error("Error al registrar voto:", e);
                }
            };

            const submitIdea = async (e) => {
                e.preventDefault();
                if (!newIdea.trim() || !ideaTitle.trim() || !user || !db) return;
                setIsSubmitting(true);
                
                const proposalsRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('proposals');

                try {
                    await proposalsRef.add({
                        title: ideaTitle,
                        desc: newIdea,
                        votes: 0,
                        showCount: 0,
                        createdAt: firebase.firestore.FieldValue.serverTimestamp(),
                        authorId: user.uid
                    });
                    setNewIdea("");
                    setIdeaTitle("");
                    setView('ranking');
                } catch (e) {
                    console.error("Error al guardar propuesta:", e);
                } finally {
                    setIsSubmitting(false);
                }
            };

            const rankedProposals = useMemo(() => {
                // Ordenar en memoria (Regla: Evitar consultas complejas en Firestore)
                return [...proposals].sort((a, b) => {
                    const scoreA = (a.showCount || 0) > 0 ? (a.votes / a.showCount) : 0;
                    const scoreB = (b.showCount || 0) > 0 ? (b.votes / b.showCount) : 0;
                    return scoreB - scoreA;
                });
            }, [proposals]);

            if (loading) return (
                <div className="h-screen flex flex-col items-center justify-center bg-[#020617]">
                    <div className="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p className="text-[10px] font-bold uppercase tracking-[0.3em] text-indigo-400">Verificando Credenciales...</p>
                </div>
            );

            return (
                <div className="min-h-screen flex flex-col gradient-bg">
                    <nav className="fixed top-0 w-full z-50 px-6 py-4 bg-[#020617]/90 backdrop-blur-md border-b border-white/5">
                        <div className="max-w-6xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2 cursor-pointer" onClick={() => setView('home')}>
                                <div className="accent-gradient text-white font-black px-2 py-0.5 rounded text-[10px]">CL</div>
                                <span className="font-extrabold text-xl tracking-tighter uppercase italic">DEMOCRACIA<span className="text-indigo-500">DIRECTACL</span></span>
                            </div>
                            <div className="flex gap-4 md:gap-8 items-center text-[11px] font-bold uppercase tracking-widest text-slate-400">
                                <button onClick={() => setView('vote')} className={view === 'vote' ? 'text-indigo-400' : 'hover:text-white'}>Votar</button>
                                <button onClick={() => setView('ranking')} className={view === 'ranking' ? 'text-indigo-400' : 'hover:text-white'}>Ranking</button>
                                <button onClick={() => setView('propose')} className="accent-gradient text-white px-4 py-2 rounded-xl shadow-lg hover:scale-105 transition-transform">Proponer</button>
                            </div>
                        </div>
                    </nav>

                    <main className="flex-grow pt-32 pb-20 px-6 max-w-5xl mx-auto w-full animate-fade-in">
                        {view === 'home' && (
                            <div className="text-center py-10 md:py-20 space-y-10">
                                <h1 className="text-5xl md:text-[6.5rem] font-black leading-none uppercase tracking-tighter">
                                    CHILE DECIDE <br/><span className="text-indigo-500 italic">SIN INTERMEDIARIOS.</span>
                                </h1>
                                <p className="text-slate-400 text-lg md:text-xl max-w-2xl mx-auto leading-relaxed">
                                    Participa en la priorización de las leyes e iniciativas que el país necesita. Tu voz es la decisión final en DEMOCRACIADIRECTACL.
                                </p>
                                <div className="flex flex-col sm:flex-row gap-4 justify-center pt-6">
                                    <button onClick={() => setView('vote')} className="bg-white text-slate-950 px-10 py-5 rounded-2xl font-black text-lg shadow-2xl hover:bg-slate-200 transition-all">EMPEZAR A VOTAR</button>
                                    <button onClick={() => setView('propose')} className="glass px-10 py-5 rounded-2xl font-black text-lg border-white/10 text-white">SUBIR INICIATIVA</button>
                                </div>
                            </div>
                        )}

                        {view === 'vote' && (
                            <div className="space-y-12">
                                <div className="text-center">
                                    <h2 className="text-3xl font-black italic uppercase tracking-tighter mb-2">Prioridad Ciudadana</h2>
                                    <p className="text-slate-500 text-[10px] font-bold uppercase tracking-[0.2em]">Selecciona la propuesta más urgente</p>
                                </div>
                                <div className="grid md:grid-cols-2 gap-8 items-stretch">
                                    {currentPair.length > 0 ? currentPair.map(p => (
                                        <div key={p.id} onClick={() => handleVote(p.id)} className="glass p-10 vote-card flex flex-col justify-between min-h-[350px] border-white/5 hover:border-indigo-500/50">
                                            <div>
                                                <h3 className="text-2xl font-extrabold uppercase mb-4 leading-tight tracking-tight text-white">{p.title}</h3>
                                                <p className="text-slate-400 text-base leading-relaxed line-clamp-6">{p.desc}</p>
                                            </div>
                                            <div className="mt-8 flex items-center gap-2">
                                                <div className="h-[1px] flex-grow bg-white/5"></div>
                                                <span className="text-[9px] font-black uppercase tracking-widest text-indigo-500">Confirmar Prioridad</span>
                                            </div>
                                        </div>
                                    )) : <div className="col-span-2 text-center py-20 glass border-dashed italic text-slate-500 border-white/10">Buscando propuestas... (Se requieren al menos 2 activas)</div>}
                                </div>
                            </div>
                        )}

                        {view === 'ranking' && (
                            <div className="max-w-3xl mx-auto space-y-6">
                                <h2 className="text-4xl font-black italic uppercase tracking-tighter mb-8 text-center">Ranking <span className="text-indigo-500">Nacional</span></h2>
                                {rankedProposals.length > 0 ? rankedProposals.map((p, i) => (
                                    <div key={p.id} className="glass p-6 flex items-center justify-between hover:bg-white/[0.02] border-white/5">
                                        <div className="flex items-center gap-6">
                                            <span className="text-4xl font-black text-slate-800 italic w-12 text-center">#{i+1}</span>
                                            <div>
                                                <h3 className="font-extrabold uppercase text-sm tracking-tight text-white">{p.title}</h3>
                                                <p className="text-[9px] text-slate-500 font-bold uppercase tracking-widest">{(p.votes || 0)} Votos</p>
                                            </div>
                                        </div>
                                        <div className="text-right">
                                            <div className="text-indigo-400 font-black text-3xl italic leading-none">
                                                {(p.showCount || 0) > 0 ? Math.round((p.votes / p.showCount) * 100) : 0}%
                                            </div>
                                            <p className="text-[8px] font-bold text-slate-600 uppercase mt-1">Aprobación</p>
                                        </div>
                                    </div>
                                )) : <div className="text-center py-10 text-slate-500 glass border-white/5">No hay datos suficientes para mostrar el ranking nacional</div>}
                            </div>
                        )}

                        {view === 'propose' && (
                            <div className="max-w-2xl mx-auto space-y-10">
                                <h2 className="text-5xl font-black italic uppercase tracking-tighter text-center">Tu Propuesta</h2>
                                <form onSubmit={submitIdea} className="glass p-8 md:p-12 space-y-8 shadow-2xl border-white/10">
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Título de la Iniciativa</label>
                                        <input className="w-full bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-indigo-500 font-bold text-lg text-white" value={ideaTitle} onChange={(e) => setIdeaTitle(e.target.value)} placeholder="Ej: Nueva Ley de Humedales" required />
                                    </div>
                                    <div className="space-y-2">
                                        <label className="text-[10px] font-black uppercase tracking-widest text-slate-500 ml-2">Explicación detallada</label>
                                        <textarea className="w-full h-48 bg-white/5 border border-white/10 rounded-2xl p-5 outline-none focus:border-indigo-500 resize-none font-medium text-white" value={newIdea} onChange={(e) => setNewIdea(e.target.value)} placeholder="Describe por qué esta propuesta es importante para Chile..." required />
                                    </div>
                                    <button type="submit" disabled={isSubmitting} className="w-full bg-white text-slate-950 py-6 rounded-2xl font-black text-xl hover:bg-indigo-500 hover:text-white transition-all shadow-xl disabled:opacity-50">
                                        {isSubmitting ? 'PUBLICANDO...' : 'LANZAR INICIATIVA'}
                                    </button>
                                </form>
                            </div>
                        )}
                    </main>

                    <footer className="py-12 border-t border-white/5 bg-[#010410] text-center">
                        <p className="text-[10px] font-bold text-slate-700 uppercase tracking-[0.6em]">
                            DEMOCRACIADIRECTACL — 2026
                        </p>
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

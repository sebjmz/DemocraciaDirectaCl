<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Democracia Directa Chile</title>
    <!-- 1. Estilos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 2. Motores de React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- 3. Traductor de Código (Babel) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-white">
    <div id="root">
        <!-- Esto se ve mientras carga el sistema -->
        <div class="flex items-center justify-center min-h-screen">
            <div class="text-center">
                <div class="animate-spin rounded-full h-12 w-12 border-b-2 border-blue-500 mx-auto mb-4"></div>
                <p class="text-xl font-light">Iniciando Soberanía Digital...</p>
            </div>
        </div>
    </div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [cargado, setCargado] = useState(false);

            useEffect(() => {
                // Simulamos la conexión inicial
                setTimeout(() => setCargado(true), 1000);
            }, []);

            if (!cargado) {
                return (
                    <div class="flex items-center justify-center min-h-screen">
                        <p class="animate-pulse">Conectando con la base de datos...</p>
                    </div>
                );
            }

            return (
                <div class="min-h-screen p-6 flex flex-col items-center">
                    <nav class="w-full max-w-4xl flex justify-between items-center mb-12">
                        <h1 class="text-2xl font-bold border-b-2 border-blue-500">CHILE DIRECTO</h1>
                        <span class="bg-blue-600 px-3 py-1 rounded-full text-xs font-bold uppercase">Beta</span>
                    </nav>

                    <main class="w-full max-w-2xl bg-slate-800 rounded-3xl p-8 shadow-2xl border border-slate-700">
                        <div class="text-center mb-8">
                            <h2 class="text-3xl font-bold mb-2">Bienvenido Ciudadano</h2>
                            <p class="text-slate-400">El sistema de votación está activo y listo.</p>
                        </div>

                        <div class="grid grid-cols-1 gap-4">
                            <button class="bg-blue-600 hover:bg-blue-500 p-4 rounded-xl font-bold transition-all transform hover:scale-105">
                                Ver Propuestas Actuales
                            </button>
                            <button class="bg-slate-700 hover:bg-slate-600 p-4 rounded-xl font-bold transition-all">
                                Crear Nueva Iniciativa
                            </button>
                        </div>
                    </main>

                    <footer class="mt-auto pt-10 text-slate-500 text-sm">
                        Conectado a Firebase (ID: democraciadirectacl)
                    </footer>
                </div>
            );
        }

        // Renderizar la aplicación
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEMOCRACIADIRECTACL | Arena Directa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=Merriweather:ital,wght@0,900;1,900&display=swap" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, updateDoc, increment } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBWxTFJGOFesMgIyp5C65qQEnFr5_dCxcU",
            authDomain: "democraciadirectacl-b75ad.firebaseapp.com",
            projectId: "democraciadirectacl-b75ad",
            storageBucket: "democraciadirectacl-b75ad.firebasestorage.app",
            messagingSenderId: "837131448793",
            appId: "1:837131448793:web:2b5d2aef6e925bac8d29c8"
        };

        const appId = 'democraciadirectacl';
        const apiKey = "AIzaSyB8uKzOtzkiVoCD_mX0pLqhsvwFhYw59oQ"; 
        let db, auth, user;
        let todasLasPropuestas = [];
        let vistaActual = 'duelo'; // Entrada directa al duelo
        let cargandoVoto = false;
        let totalVotosGlobal = 0;
        let dueloActualIds = []; 

        const mensajesAliento = [
            "Tu voz es la piedra angular del nuevo Chile.",
            "Construyendo una nación más justa, segundo a segundo.",
            "La soberanía reside en tu capacidad de proponer.",
            "Por un futuro donde el pueblo siempre sea escuchado.",
            "Tu idea está siendo procesada por el bien de la patria.",
            "Unidos, estamos diseñando el Chile de la próxima década.",
            "Gracias por comprometerte con el destino de nuestra tierra."
        ];

        async function conectarFirebase() {
            try {
                const app = initializeApp(firebaseConfig);
                auth = getAuth(app);
                db = getFirestore(app);
                await signInAnonymously(auth);
                onAuthStateChanged(auth, (u) => {
                    if (u) {
                        user = u;
                        escucharDatos();
                    }
                });
            } catch (e) { 
                console.error("Error conectando:", e);
                actualizarComponentes();
            }
        }

        function escucharDatos() {
            // RULE 1: Strict Paths
            const colRef = collection(db, 'artifacts', appId, 'public', 'data', 'propuestas');
            onSnapshot(colRef, (snapshot) => {
                let total = 0;
                let nuevasPropuestas = [];
                snapshot.forEach(doc => {
                    const data = doc.data();
                    total += (data.votos || 0);
                    nuevasPropuestas.push({ id: doc.id, ...data });
                });
                
                todasLasPropuestas = nuevasPropuestas;
                totalVotosGlobal = total;
                actualizarComponentes();
            }, (error) => {
                console.error("Error en tiempo real:", error);
                actualizarComponentes();
            });
        }

        function actualizarComponentes() {
            document.querySelectorAll('.contador-votos-tiempo-real').forEach(c => {
                c.innerText = totalVotosGlobal.toLocaleString();
            });
            if (vistaActual === 'ranking') renderizarRanking();
            if (vistaActual === 'duelo' && dueloActualIds.length === 0) presentarNuevoDuelo();
        }

        window.navegar = (vista) => {
            vistaActual = vista;
            document.getElementById('seccion-duelo').classList.toggle('hidden', vista !== 'duelo');
            document.getElementById('seccion-ranking').classList.toggle('hidden', vista !== 'ranking');
            
            const btnDuelo = document.getElementById('nav-duelo');
            const btnRanking = document.getElementById('nav-ranking');
            
            if (vista === 'duelo') {
                btnDuelo.className = 'nav-btn active-nav rounded-xl';
                btnRanking.className = 'nav-btn inactive-nav rounded-xl';
                document.body.style.backgroundColor = "#f4f7fa";
            } else {
                btnDuelo.className = 'nav-btn inactive-nav rounded-xl';
                btnRanking.className = 'nav-btn active-nav rounded-xl';
                document.body.style.backgroundColor = "#ffffff";
            }
            
            if (vista === 'ranking') renderizarRanking();
            if (vista === 'duelo' && dueloActualIds.length === 0) presentarNuevoDuelo();
            window.scrollTo(0, 0);
        };

        async function procesarConIA(texto) {
            try {
                const systemPrompt = `Eres un sintetizador de voluntad popular para Chile.
                1. Resume la idea de forma CRUDA, CLARA y CORTA.
                2. Si hay insultos o spam, devuelve: {"error": true}.
                3. Formato JSON: {"titulo":"MÁX 3 PALABRAS", "descripcion":"Una sola frase de impacto"}`;
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
    method: 'POST',
    headers: {
        'Content-Type': 'application/json'
    },
    body: JSON.stringify({
        contents: [{
            parts: [{ text: texto }]
        }]
    })
});
                const data = await response.json();
                const result = JSON.parse(data.candidates?.[0]?.content?.parts?.[0]?.text || "{}");
                return result.error ? null : result;
            } catch (e) { 
                return { titulo: "NUEVA IDEA", descripcion: texto.substring(0, 60) }; 
            }
        }

        window.enviarPropuesta = async (e) => {
            e.preventDefault();
            const input = document.getElementById('input-idea');
            const btn = document.getElementById('btn-enviar');
            const texto = input.value.trim();
            if (!texto || !user || btn.disabled) return;

            const loader = document.getElementById('ia-loader');
            const feedback = document.getElementById('form-feedback');
            const timerDisplay = document.getElementById('timer-seconds');
            const alientoDisplay = document.getElementById('texto-aliento');
            
            loader.classList.remove('hidden');
            feedback.classList.add('hidden');
            btn.disabled = true;

            let timeLeft = 30;
            timerDisplay.innerText = timeLeft;
            alientoDisplay.innerText = mensajesAliento[Math.floor(Math.random() * mensajesAliento.length)];
            
            const countdown = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
                if (timeLeft % 7 === 0) alientoDisplay.innerText = mensajesAliento[Math.floor(Math.random() * mensajesAliento.length)];
                if (timeLeft <= 0) clearInterval(countdown);
            }, 1000);

            const tareaIA = procesarConIA(texto);

            setTimeout(async () => {
                const resumen = await tareaIA;
                if (!resumen) {
                    loader.classList.add('hidden');
                    feedback.innerText = "CONTENIDO RECHAZADO: NO CUMPLE LAS NORMAS.";
                    feedback.classList.remove('hidden');
                    btn.disabled = false;
                    clearInterval(countdown);
                    return;
                }

                try {
                    await addDoc(collection(db, 'artifacts', appId, 'public', 'data', 'propuestas'), {
                        ...resumen,
                        votos: 1,
                        creado: serverTimestamp(),
                        uid: user.uid
                    });
                    input.value = "";
                    window.navegar('ranking');
                } catch (err) {
                    feedback.innerText = "ERROR DE CONEXIÓN. REINTENTE.";
                    feedback.classList.remove('hidden');
                } finally {
                    loader.classList.add('hidden');
                    btn.disabled = false;
                    clearInterval(countdown);
                }
            }, 30000);
        };

        function presentarNuevoDuelo() {
            const container = document.getElementById('contenedor-duelo');
            if (todasLasPropuestas.length < 2) {
                container.innerHTML = `<div class="p-20 text-center animate-pulse text-indigo-400 font-black italic uppercase tracking-widest">Sincronizando voluntad ciudadana...</div>`;
                return;
            }

            const shuffled = [...todasLasPropuestas].sort(() => 0.5 - Math.random());
            const seleccionadas = shuffled.slice(0, 2);
            dueloActualIds = seleccionadas.map(p => p.id);

            const card = (p, label, colorClass) => `
                <button onclick="votar('${p.id}')" class="group relative p-8 bg-white border-b-[8px] border-slate-200 rounded-[2.5rem] hover:border-orange-500 hover:shadow-2xl transition-all text-left flex flex-col min-h-[350px] w-full animate-fade">
                    <div class="flex justify-between items-center mb-8">
                        <span class="text-[10px] font-black text-white ${colorClass} px-5 py-1.5 rounded-full uppercase tracking-[0.2em] shadow-md">${label}</span>
                        <div class="h-12 w-12 rounded-xl bg-slate-100 text-slate-400 flex items-center justify-center group-hover:bg-orange-500 group-hover:text-white transition-all transform group-hover:rotate-12">
                            <i class="fas fa-check-circle text-xl"></i>
                        </div>
                    </div>
                    <h3 class="text-3xl md:text-5xl font-black text-slate-900 tracking-tighter mb-6 leading-[0.9] uppercase group-hover:text-indigo-600 transition-colors">${p.titulo}</h3>
                    <p class="text-lg md:text-xl text-slate-500 font-semibold leading-snug flex-grow">${p.descripcion}</p>
                    <div class="mt-6 pt-6 border-t border-slate-100 flex items-center justify-between">
                        <span class="text-[9px] font-black text-slate-300 uppercase tracking-widest italic">Toca para elegir</span>
                        <i class="fas fa-arrow-right text-orange-500 opacity-0 group-hover:opacity-100 group-hover:translate-x-2 transition-all"></i>
                    </div>
                </button>
            `;

            container.innerHTML = `
                <div class="grid md:grid-cols-2 gap-8 relative">
                    ${card(seleccionadas[0], 'OPCIÓN A', 'bg-indigo-600')}
                    <div class="hidden md:flex absolute left-1/2 -translate-x-1/2 top-1/2 -translate-y-1/2 z-20 w-16 h-16 bg-orange-600 text-white items-center justify-center rounded-2xl font-black italic border-[6px] border-[#f4f7fa] shadow-2xl rotate-12">VS</div>
                    ${card(seleccionadas[1], 'OPCIÓN B', 'bg-slate-900')}
                </div>
            `;
        }

        window.votar = async (id) => {
            if (cargandoVoto) return;
            cargandoVoto = true;
            document.getElementById('contenedor-duelo').style.opacity = "0.3";

            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'propuestas', id);
                await updateDoc(docRef, { votos: increment(1) });
                setTimeout(() => {
                    dueloActualIds = []; 
                    presentarNuevoDuelo();
                    document.getElementById('contenedor-duelo').style.opacity = "1";
                    cargandoVoto = false;
                }, 400);
            } catch (e) {
                document.getElementById('contenedor-duelo').style.opacity = "1";
                cargandoVoto = false;
            }
        };

        function renderizarRanking() {
            const container = document.getElementById('lista-ranking');
            const sorted = [...todasLasPropuestas].sort((a,b) => (b.votos || 0) - (a.votos || 0)).slice(0, 30);
            const maxVotosLider = sorted.length > 0 ? (sorted[0].votos || 0) : 0;

            container.innerHTML = sorted.map((p, i) => {
                const votosPropuesta = p.votos || 0;
                const apoyoGlobalPct = totalVotosGlobal > 0 ? ((votosPropuesta / totalVotosGlobal) * 100).toFixed(1) : "0.0";
                const barraIntensidadPct = maxVotosLider > 0 ? ((votosPropuesta / maxVotosLider) * 100) : 0;

                return `
                <div class="bg-slate-50 p-8 rounded-[3rem] mb-6 border-l-[10px] border-indigo-600 flex flex-col md:flex-row items-center gap-8 shadow-sm animate-fade">
                    <span class="text-6xl font-black text-slate-200 w-24 text-center italic">#${i+1}</span>
                    <div class="flex-1 w-full">
                        <h4 class="font-black text-slate-900 uppercase text-3xl mb-1 tracking-tighter leading-none">${p.titulo}</h4>
                        <p class="text-slate-500 font-bold text-base mb-4">${p.descripcion}</p>
                        <div class="w-full h-3 bg-white rounded-full overflow-hidden border border-slate-100">
                            <div class="h-full bg-indigo-600 rounded-full transition-all duration-1000" style="width: ${barraIntensidadPct}%"></div>
                        </div>
                    </div>
                    <div class="text-center md:text-right bg-white px-8 py-4 rounded-3xl min-w-[140px] border border-slate-100">
                        <span class="block text-3xl font-black text-indigo-900 leading-none">${apoyoGlobalPct}%</span>
                        <span class="text-[8px] font-black text-slate-400 uppercase tracking-widest mt-1 block">APOYO</span>
                    </div>
                </div>
            `}).join('');
        }

        window.onload = conectarFirebase;

    </script>

    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f4f7fa; }
        .nav-btn { @apply px-10 py-4 font-black text-[11px] uppercase tracking-[0.3em] border-b-[4px] transition-all; }
        .active-nav { @apply text-indigo-600 border-indigo-600; }
        .inactive-nav { @apply text-slate-300 border-transparent hover:text-slate-500; }
        @keyframes fade-in { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade { animation: fade-in 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
</head>
<body class="selection:bg-orange-500 selection:text-white overflow-x-hidden">

    <!-- APP INTERFACE (ACTIVA POR DEFECTO) -->
    <div id="app-interface" class="min-h-screen flex flex-col">
        <nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-xl border-b border-slate-100 px-6 py-4 shadow-sm">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="font-black text-2xl tracking-tighter uppercase italic cursor-pointer" onclick="location.reload()">
                    DEMOCRACIA<span class="text-indigo-600">DIRECTACL</span>
                </div>
                
                <div class="flex bg-slate-100 p-1.5 rounded-2xl gap-1">
                    <button id="nav-duelo" onclick="navegar('duelo')" class="nav-btn active-nav rounded-xl">Arena</button>
                    <button id="nav-ranking" onclick="navegar('ranking')" class="nav-btn inactive-nav rounded-xl">Resultados</button>
                </div>
            </div>
        </nav>

        <main class="flex-1 max-w-6xl mx-auto w-full p-6 py-12">
            
            <!-- SECCIÓN DUELO -->
            <div id="seccion-duelo" class="animate-fade">
                <div class="mb-12 text-center">
                    <div class="inline-block bg-slate-900 text-white px-6 py-1.5 rounded-full mb-6">
                        <span class="text-[9px] font-black uppercase tracking-[0.3em]">
                            <span class="contador-votos-tiempo-real text-orange-400">...</span> Mandatos Ciudadanos
                        </span>
                    </div>
                    <h2 class="text-4xl md:text-5xl font-black uppercase tracking-tighter mb-2 italic">Duelo de Ideas</h2>
                    <p class="text-slate-400 font-bold uppercase tracking-widest text-[9px]">Elige la propuesta más urgente para Chile</p>
                </div>

                <div id="contenedor-duelo" class="mb-20 min-h-[400px]"></div>
                
                <!-- EMISIÓN DE MANDATO -->
                <div class="max-w-3xl mx-auto">
                    <div class="bg-white p-10 md:p-14 rounded-[3.5rem] shadow-2xl relative overflow-hidden border-t-[10px] border-orange-500">
                        <div class="relative z-10">
                            <h3 class="text-[11px] font-black text-orange-900 uppercase tracking-[0.4em] mb-6 text-center">Nuevo Mandato Ciudadano</h3>

                            <form onsubmit="enviarPropuesta(event)">
                                <textarea id="input-idea" rows="2" placeholder="¿Qué debe cambiar en Chile?" class="w-full p-8 bg-slate-50 rounded-[2rem] border-4 border-transparent focus:border-indigo-100 focus:bg-white focus:ring-0 text-xl font-bold mb-8 resize-none transition-all placeholder:text-slate-200"></textarea>
                                
                                <p id="form-feedback" class="hidden mb-8 text-[10px] font-black text-white bg-red-600 p-6 rounded-2xl text-center uppercase"></p>

                                <div id="ia-loader" class="hidden absolute inset-0 bg-white/98 backdrop-blur-md rounded-[3.5rem] flex items-center justify-center z-20 px-10 text-center">
                                    <div>
                                        <div class="relative w-24 h-24 mx-auto mb-8">
                                            <div class="absolute inset-0 border-[6px] border-slate-100 rounded-full"></div>
                                            <div class="absolute inset-0 border-[6px] border-indigo-600 border-t-transparent rounded-full animate-spin"></div>
                                            <div class="absolute inset-0 flex items-center justify-center">
                                                <span id="timer-seconds" class="text-3xl font-black text-indigo-600">30</span>
                                            </div>
                                        </div>
                                        <p id="texto-aliento" class="text-lg md:text-xl font-black text-slate-900 italic leading-tight mb-4 px-4"></p>
                                        <p class="text-[9px] font-black uppercase tracking-[0.4em] text-slate-400">Validando autenticidad de la propuesta</p>
                                    </div>
                                </div>

                                <button id="btn-enviar" type="submit" class="w-full bg-slate-900 text-white py-8 rounded-[2rem] font-black text-lg uppercase tracking-[0.4em] hover:bg-indigo-600 transition-all shadow-xl active:scale-95 disabled:opacity-50">
                                    Enviar a la Arena
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>

            <!-- SECCIÓN RANKING -->
            <div id="seccion-ranking" class="hidden animate-fade">
                <div class="mb-16">
                    <span class="bg-indigo-600 text-white px-5 py-2 rounded-full text-[9px] font-black uppercase tracking-[0.3em]">Consenso Nacional</span>
                    <h2 class="text-6xl md:text-8xl font-black italic tracking-tighter mt-6">Top <span class="text-indigo-600">30</span></h2>
                    <p class="text-slate-400 font-bold uppercase tracking-widest text-[10px] mt-4">Las ideas con mayor respaldo ciudadano en tiempo real</p>
                </div>
                <div id="lista-ranking" class="max-w-4xl mx-auto pb-40"></div>
            </div>
        </main>
    </div>

</body>
</html>
